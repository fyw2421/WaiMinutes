<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-labelledby="t d">
  <title id="t">提交与回退</title>
  <desc id="d">9 个主题 · add / commit / log / reset</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#43260f"/><stop offset="0.58" stop-color="#22130a"/><stop offset="1" stop-color="#22130a"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.9"><stop offset="0" stop-color="#d08a4a" stop-opacity="0.34"/><stop offset="0.7" stop-color="#d08a4a" stop-opacity="0"/></radialGradient>
    <style>.sans { font-family: 'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC','Source Han Sans SC',sans-serif; } .mono { font-family: 'Cascadia Mono','Consolas','SFMono-Regular',monospace; }</style>
  </defs>
  <rect width="1500" height="1000" fill="url(#bg)"/>
  <rect width="1500" height="1000" fill="url(#glow)"/>
  <g opacity="0.5" stroke="#e8b98a" stroke-opacity="0.18" fill="none"><rect x="1090" y="150" width="300" height="300" rx="36"/><rect x="1150" y="210" width="300" height="300" rx="36"/><rect x="1210" y="270" width="300" height="300" rx="36"/></g>
  <text class="mono" x="80" y="190" fill="#e8b98a" font-size="30" letter-spacing="6">GIT CHEAT SHEETS · 02</text>
  <text class="sans" x="80" y="312" fill="#f8fafc" font-size="92" font-weight="700">提交与回退</text>
  <text class="sans" x="80" y="384" fill="#c6d3e2" font-size="32">9 个主题 · add / commit / log / reset</text>
  <line x1="80" y1="432" x2="240" y2="432" stroke="#e8b98a" stroke-width="4" stroke-linecap="round"/>
  <g>
    <rect x="80" y="540" width="305" height="250" rx="28" fill="#ffffff" fill-opacity="0.055" stroke="#e8b98a" stroke-opacity="0.30"/>
    <text class="mono" x="116" y="600" fill="#e8b98a" fill-opacity="0.65" font-size="26" letter-spacing="4">01</text>
    <text class="sans" x="116" y="690" fill="#e6edf6" font-size="42" font-weight="600">创建与克隆</text>
    <text class="mono" x="116" y="742" fill="#e8b98a" fill-opacity="0.75" font-size="22" letter-spacing="1">CREATE / CLONE</text>
  </g>
  <g>
    <rect x="425" y="540" width="305" height="250" rx="28" fill="#ffffff" fill-opacity="0.055" stroke="#e8b98a" stroke-opacity="0.30"/>
    <text class="mono" x="461" y="600" fill="#e8b98a" fill-opacity="0.65" font-size="26" letter-spacing="4">02</text>
    <text class="sans" x="461" y="690" fill="#e6edf6" font-size="36" font-weight="600">add 与 commit</text>
    <text class="mono" x="461" y="742" fill="#e8b98a" fill-opacity="0.75" font-size="22" letter-spacing="1">STAGE / COMMIT</text>
  </g>
  <g>
    <rect x="770" y="540" width="305" height="250" rx="28" fill="#ffffff" fill-opacity="0.055" stroke="#e8b98a" stroke-opacity="0.30"/>
    <text class="mono" x="806" y="600" fill="#e8b98a" fill-opacity="0.65" font-size="26" letter-spacing="4">03</text>
    <text class="sans" x="806" y="690" fill="#e6edf6" font-size="36" font-weight="600">log 与 reflog</text>
    <text class="mono" x="806" y="742" fill="#e8b98a" fill-opacity="0.75" font-size="22" letter-spacing="1">HISTORY</text>
