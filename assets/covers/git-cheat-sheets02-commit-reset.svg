  <g>
    <rect x="1115" y="540" width="305" height="250" rx="28" fill="#ffffff" fill-opacity="0.055" stroke="#e8b98a" stroke-opacity="0.30"/>
    <text class="mono" x="1151" y="600" fill="#e8b98a" fill-opacity="0.65" font-size="26" letter-spacing="4">04</text>
