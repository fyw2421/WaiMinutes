<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-labelledby="t d">
  <title id="t">模板方法模式 UML 类图</title>
  <desc id="d">AbstractClass 定义 TemplateMethod 与两个 PrimitiveOperation；ConcreteClassA 继承并实现原语操作</desc>
  <defs>
    <style>
      .box   { fill:#f3e4c4; stroke:#9c8254; stroke-width:1.2; }
      .note  { fill:#fdfaf3; stroke:#c9b89a; stroke-width:1.2; }
      .sep   { stroke:#9c8254; stroke-width:1; }
      .caption{ font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:22px; font-weight:700; fill:#1f1f1f; text-anchor:middle; }
      .title { font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:20px; font-weight:700; fill:#1f1f1f; text-anchor:middle; }
      .titlei{ font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:20px; font-weight:700; font-style:italic; fill:#1f1f1f; text-anchor:middle; }
      .member{ font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:16px; fill:#1f1f1f; }
      .ntext { font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:15px; fill:#1f1f1f; }
      .line  { stroke:#1f1f1f; stroke-width:1.4; fill:none; }
      .dash  { stroke:#1f1f1f; stroke-width:1.3; fill:none; stroke-dasharray:6 4; }
      .hollow{ fill:#ffffff; stroke:#1f1f1f; stroke-width:1.4; stroke-linejoin:round; }
    </style>
    <marker id="openArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1,1 L10,6 L1,11" fill="none" stroke="#1f1f1f" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="880" height="420" fill="#ffffff"/>
  <text class="caption" x="440" y="36">模板方法（TemplateMethod）结构</text>

  <!-- AbstractClass -->
  <rect class="box" x="40" y="70" width="300" height="160" rx="2"/>
  <line class="sep" x1="40" y1="110" x2="340" y2="110"/>
  <text class="titlei" x="190" y="98">AbstractClass</text>
  <text class="member" x="56" y="140">+TemplateMethod()</text>
  <text class="member" x="56" y="170">+PrimitiveOperation1()</text>
  <text class="member" x="56" y="200">+PrimitiveOperation2()</text>

  <!-- ConcreteClassA -->
  <rect class="box" x="40" y="300" width="300" height="110" rx="2"/>
  <line class="sep" x1="40" y1="336" x2="340" y2="336"/>
  <text class="title" x="190" y="324">ConcreteClassA</text>
  <text class="member" x="56" y="366">+PrimitiveOperation1()</text>
  <text class="member" x="56" y="394">+PrimitiveOperation2()</text>

  <!-- 注释 -->
  <g>
    <path class="note" d="M430 90 H860 L880 110 V180 H430 Z"/>
    <path class="note" d="M860 90 V110 H880" fill="none"/>
    <text class="ntext" x="446" y="122">实现了一个模板方法，定义了算法的骨架，</text>
    <text class="ntext" x="446" y="148">具体子类将重定义PrimitiveOperation以</text>
    <text class="ntext" x="446" y="174">实现一个算法的步骤</text>
  </g>
  <g>
    <path class="note" d="M430 300 H860 L880 320 V370 H430 Z"/>
    <path class="note" d="M860 300 V320 H880" fill="none"/>
    <text class="ntext" x="446" y="332">实现PrimitiveOperation以完成算法中</text>
    <text class="ntext" x="446" y="358">与特定子类相关的步骤</text>
  </g>

  <!-- 继承 -->
  <path class="line" d="M190 300 L190 252"/>
  <path class="hollow" d="M190 230 L179 252 L201 252 Z"/>

  <!-- 依赖 -->
  <line class="dash" x1="342" y1="150" x2="430" y2="150" marker-end="url(#openArrow)"/>
  <line class="dash" x1="342" y1="345" x2="430" y2="345" marker-end="url(#openArrow)"/>
</svg>
