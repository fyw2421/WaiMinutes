<svg xmlns="http://www.w3.org/2000/svg" width="800" height="580" viewBox="0 0 800 580" role="img" aria-labelledby="t d">
  <title id="t">工厂方法模式 UML 类图</title>
  <desc id="d">Creator 声明 FactoryMethod；ConcreteCreator 继承并重定义它来返回 ConcreteProduct；ConcreteProduct 实现 Product 接口</desc>
  <defs>
    <style>
      .box   { fill:#f3e4c4; stroke:#9c8254; stroke-width:1; }
      .note  { fill:#fdfaf3; stroke:#c9b89a; stroke-width:1; }
      .sep   { stroke:#9c8254; stroke-width:1; }
      .caption{ font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:20px; font-weight:700; fill:#1f1f1f; text-anchor:middle; }
      .title { font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:15px; font-weight:700; fill:#1f1f1f; text-anchor:middle; }
      .titlei{ font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:15px; font-weight:700; font-style:italic; fill:#1f1f1f; text-anchor:middle; }
      .member{ font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:13px; fill:#1f1f1f; }
      .ntext { font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:12px; fill:#1f1f1f; }
      .line  { stroke:#1f1f1f; stroke-width:1.1; fill:none; }
      .dash  { stroke:#1f1f1f; stroke-width:1; fill:none; stroke-dasharray:5 3; }
      .hollow{ fill:#ffffff; stroke:#1f1f1f; stroke-width:1.1; stroke-linejoin:round; }
    </style>
    <marker id="openArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1,1 L10,6 L1,11" fill="none" stroke="#1f1f1f" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect width="800" height="580" fill="#ffffff"/>
  <text class="caption" x="400" y="34">工厂方法模式（Factory Method）结构图</text>

  <!-- 顶部注释 -->
  <g>
    <path class="note" d="M60 60 H370 L384 74 V128 H60 Z"/>
    <path class="note" d="M370 60 V74 H384" fill="none"/>
    <text class="ntext" x="72" y="100">定义工厂方法所创建的对象接口</text>
  </g>
  <g>
    <path class="note" d="M430 60 H760 L774 74 V128 H430 Z"/>
    <path class="note" d="M760 60 V74 H774" fill="none"/>
    <text class="ntext" x="442" y="100">声明工厂方法，该方法返回一个 Product 类型的对象</text>
  </g>

  <!-- Product / Creator -->
  <rect class="box" x="160" y="200" width="180" height="80" rx="2"/>
  <line class="sep" x1="160" y1="230" x2="340" y2="230"/>
  <line class="sep" x1="160" y1="256" x2="340" y2="256"/>
  <text class="title" x="250" y="222">Product</text>

  <rect class="box" x="460" y="195" width="220" height="90" rx="2"/>
  <line class="sep" x1="460" y1="225" x2="680" y2="225"/>
  <text class="titlei" x="570" y="217">Creator</text>
  <text class="member" x="474" y="252">+FactoryMethod ()</text>

  <!-- ConcreteProduct / ConcreteCreator -->
  <rect class="box" x="150" y="370" width="190" height="80" rx="2"/>
  <line class="sep" x1="150" y1="400" x2="340" y2="400"/>
  <line class="sep" x1="150" y1="426" x2="340" y2="426"/>
  <text class="title" x="245" y="392">ConcreteProduct</text>

  <rect class="box" x="440" y="370" width="240" height="90" rx="2"/>
  <line class="sep" x1="440" y1="400" x2="680" y2="400"/>
  <text class="title" x="560" y="392">ConcreteCreator</text>
  <text class="member" x="454" y="428">+FactoryMethod ()</text>

  <!-- 底部注释 -->
  <g>
    <path class="note" d="M60 490 H370 L384 504 V558 H60 Z"/>
    <path class="note" d="M370 490 V504 H384" fill="none"/>
    <text class="ntext" x="72" y="530">具体的产品，实现了 Product 接口</text>
  </g>
  <g>
    <path class="note" d="M430 490 H760 L774 504 V558 H430 Z"/>
    <path class="note" d="M760 490 V504 H774" fill="none"/>
    <text class="ntext" x="442" y="530">重定义工厂方法以返回一个 ConcreteProduct 实例</text>
  </g>

  <!-- 关系 -->
  <line class="dash" x1="210" y1="128" x2="236" y2="194" marker-end="url(#openArrow)"/>
  <line class="dash" x1="540" y1="128" x2="550" y2="189" marker-end="url(#openArrow)"/>

  <path class="line" d="M245 370 L245 288"/>
  <path class="hollow" d="M245 280 L234 298 L256 298 Z"/>
  <path class="line" d="M560 370 L560 293"/>
  <path class="hollow" d="M560 285 L549 303 L571 303 Z"/>

  <line class="dash" x1="438" y1="415" x2="346" y2="415" marker-end="url(#openArrow)"/>
  <line class="dash" x1="245" y1="450" x2="245" y2="486" marker-end="url(#openArrow)"/>
  <line class="dash" x1="560" y1="460" x2="560" y2="486" marker-end="url(#openArrow)"/>
</svg>
