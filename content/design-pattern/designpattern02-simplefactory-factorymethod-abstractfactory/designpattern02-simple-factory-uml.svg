<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="t d">
  <title id="t">简单工厂模式 UML 类图</title>
  <desc id="d">Factory 的 produce() 返回 AbstractProduct；ConcreteProduct 继承 AbstractProduct</desc>
  <defs>
    <style>
      .box   { fill:#f3e4c4; stroke:#9c8254; stroke-width:1.2; }
      .sep   { stroke:#9c8254; stroke-width:1; }
      .title { font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:20px; font-weight:700; fill:#1f1f1f; text-anchor:middle; }
      .member{ font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:16px; fill:#1f1f1f; }
      .line  { stroke:#1f1f1f; stroke-width:1.4; fill:none; }
      .dash  { stroke:#1f1f1f; stroke-width:1.3; fill:none; stroke-dasharray:6 4; }
      .hollow{ fill:#ffffff; stroke:#1f1f1f; stroke-width:1.4; stroke-linejoin:round; }
    </style>
    <marker id="openArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1,1 L10,6 L1,11" fill="none" stroke="#1f1f1f" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#ffffff"/>

  <!-- AbstractProduct -->
  <rect class="box" x="430" y="40" width="260" height="120" rx="2"/>
  <line class="sep" x1="430" y1="80" x2="690" y2="80"/>
  <line class="sep" x1="430" y1="120" x2="690" y2="120"/>
  <text class="title" x="560" y="63">AbstractProduct</text>

  <!-- Factory -->
  <rect class="box" x="40" y="280" width="300" height="120" rx="2"/>
  <line class="sep" x1="40" y1="320" x2="340" y2="320"/>
  <line class="sep" x1="40" y1="360" x2="340" y2="360"/>
  <text class="title" x="190" y="303">Factory</text>
  <text class="member" x="56" y="388">produce() : AbstractProduct</text>

  <!-- ConcreteProduct -->
  <rect class="box" x="430" y="280" width="260" height="120" rx="2"/>
  <line class="sep" x1="430" y1="320" x2="690" y2="320"/>
  <line class="sep" x1="430" y1="360" x2="690" y2="360"/>
  <text class="title" x="560" y="303">ConcreteProduct</text>

  <!-- 继承：ConcreteProduct -> AbstractProduct -->
  <path class="line" d="M560 280 L560 178"/>
  <path class="hollow" d="M560 160 L549 178 L571 178 Z"/>

  <!-- 依赖：Factory ..> ConcreteProduct -->
  <line class="dash" x1="340" y1="378" x2="430" y2="378" marker-end="url(#openArrow)"/>
</svg>
