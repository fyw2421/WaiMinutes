<svg xmlns="http://www.w3.org/2000/svg" width="820" height="520" viewBox="0 0 820 520" role="img" aria-labelledby="t d">
  <title id="t">代理模式 UML 类图</title>
  <desc id="d">Client 使用 Subject；RealSubject 与 Proxy 继承 Subject；Proxy 持有 RealSubject</desc>
  <defs>
    <style>
      .box   { fill:#f3e4c4; stroke:#9c8254; stroke-width:1.2; }
      .note  { fill:#fdfaf3; stroke:#c9b89a; stroke-width:1.2; }
      .sep   { stroke:#9c8254; stroke-width:1; }
      .title { font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:20px; font-weight:700; fill:#1f1f1f; text-anchor:middle; }
      .member{ font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:16px; fill:#1f1f1f; }
      .stereo{ font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:15px; fill:#333333; text-anchor:end; }
      .ntext { font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:15px; fill:#1f1f1f; text-anchor:middle; }
      .line  { stroke:#1f1f1f; stroke-width:1.4; fill:none; }
      .dash  { stroke:#1f1f1f; stroke-width:1.3; fill:none; stroke-dasharray:6 4; }
      .hollow{ fill:#ffffff; stroke:#1f1f1f; stroke-width:1.4; stroke-linejoin:round; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f1f1f"/>
    </marker>
    <marker id="openArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1,1 L10,6 L1,11" fill="none" stroke="#1f1f1f" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="820" height="520" fill="#ffffff"/>

  <!-- 注释：抽象主题类 -->
  <g>
    <path class="note" d="M370 20 H510 L530 40 V70 H370 Z"/>
    <path class="note" d="M510 20 V40 H530" fill="none"/>
    <text class="ntext" x="450" y="54">抽象主题类</text>
  </g>

  <!-- Client -->
  <rect class="box" x="40" y="120" width="150" height="90" rx="2"/>
  <line class="sep" x1="40" y1="154" x2="190" y2="154"/>
  <line class="sep" x1="40" y1="182" x2="190" y2="182"/>
  <text class="title" x="115" y="143">Client</text>

  <!-- Subject -->
  <rect class="box" x="280" y="100" width="460" height="120" rx="2"/>
  <line class="sep" x1="280" y1="140" x2="740" y2="140"/>
  <line class="sep" x1="280" y1="176" x2="740" y2="176"/>
  <text class="title" x="510" y="123">Subject</text>
  <text class="stereo" x="726" y="162">{abstract}</text>
  <text class="member" x="296" y="203">+  Request ()</text>

  <!-- RealSubject -->
  <rect class="box" x="200" y="300" width="230" height="110" rx="2"/>
  <line class="sep" x1="200" y1="336" x2="430" y2="336"/>
  <line class="sep" x1="200" y1="366" x2="430" y2="366"/>
  <text class="title" x="315" y="323">RealSubject</text>
  <text class="member" x="216" y="394">+  Request ()</text>

  <!-- Proxy -->
  <rect class="box" x="470" y="300" width="290" height="110" rx="2"/>
  <line class="sep" x1="470" y1="336" x2="760" y2="336"/>
  <line class="sep" x1="470" y1="366" x2="760" y2="366"/>
  <text class="title" x="615" y="323">Proxy</text>
  <text class="member" x="486" y="356">-  realSubject   : RealSubject</text>
  <text class="member" x="486" y="394">+  Request ()</text>

  <!-- 底部注释 -->
  <g>
    <path class="note" d="M230 450 H400 L420 470 V496 H230 Z"/>
    <path class="note" d="M400 450 V470 H420" fill="none"/>
    <text class="ntext" x="325" y="482">具体主题类</text>
  </g>
  <g>
    <path class="note" d="M470 450 H740 L760 470 V496 H470 Z"/>
    <path class="note" d="M740 450 V470 H760" fill="none"/>
    <text class="ntext" x="620" y="482">代理类，其维护一个具体主题类</text>
  </g>

  <!-- 关系 -->
  <line class="line" x1="190" y1="160" x2="280" y2="160" marker-end="url(#arrow)"/>
  <line class="dash" x1="450" y1="70" x2="510" y2="100"/>

  <path class="line" d="M315 300 L315 238"/>
  <path class="hollow" d="M315 220 L304 238 L326 238 Z"/>
  <path class="line" d="M615 300 L615 238"/>
  <path class="hollow" d="M615 220 L604 238 L626 238 Z"/>

  <line class="dash" x1="470" y1="350" x2="430" y2="350" marker-end="url(#openArrow)"/>
  <line class="dash" x1="315" y1="410" x2="315" y2="450"/>
  <line class="dash" x1="615" y1="410" x2="615" y2="450"/>
</svg>
