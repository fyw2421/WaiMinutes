<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="t d">
  <title id="t">组合模式 UML 类图</title>
  <desc id="d">Client 使用 Component；Leaf 与 Composite 继承 Component；Component 聚合 Composite 以管理子部件</desc>
  <defs>
    <style>
      .box   { fill:#f3e4c4; stroke:#9c8254; stroke-width:1; }
      .note  { fill:#fdfaf3; stroke:#c9b89a; stroke-width:1; }
      .sep   { stroke:#9c8254; stroke-width:1; }
      .title { font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:14px; font-weight:700; fill:#1f1f1f; text-anchor:middle; }
      .member{ font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:12px; fill:#1f1f1f; }
      .ntext { font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:11px; fill:#1f1f1f; }
      .line  { stroke:#1f1f1f; stroke-width:1.1; fill:none; }
      .dash  { stroke:#1f1f1f; stroke-width:1; fill:none; stroke-dasharray:5 3; }
      .hollow{ fill:#ffffff; stroke:#1f1f1f; stroke-width:1.1; stroke-linejoin:round; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f1f1f"/>
    </marker>
    <marker id="openArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1,1 L10,6 L1,11" fill="none" stroke="#1f1f1f" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect width="720" height="520" fill="#ffffff"/>

  <!-- 顶部注释 -->
  <g>
    <path class="note" d="M330 20 H690 L704 34 V100 H330 Z"/>
    <path class="note" d="M690 20 V34 H704" fill="none"/>
    <text class="ntext" x="342" y="46">组合中的对象声明接口，在适当情况下，实现</text>
    <text class="ntext" x="342" y="68">所有类共有接口的默认行为。声明一个接口用</text>
    <text class="ntext" x="342" y="90">于访问和管理Component的子部件</text>
  </g>

  <!-- Client -->
  <rect class="box" x="30" y="130" width="130" height="70" rx="2"/>
  <line class="sep" x1="30" y1="156" x2="160" y2="156"/>
  <line class="sep" x1="30" y1="178" x2="160" y2="178"/>
  <text class="title" x="95" y="148">Client</text>

  <!-- Component -->
  <rect class="box" x="280" y="116" width="230" height="104" rx="2"/>
  <line class="sep" x1="280" y1="144" x2="510" y2="144"/>
  <text class="title" x="395" y="136">Component</text>
  <text class="member" x="294" y="166">+Add(c: Component)</text>
  <text class="member" x="294" y="188">+Remove(c: Component)</text>
  <text class="member" x="294" y="210">+Display(depth: int)</text>

  <!-- Leaf -->
  <rect class="box" x="120" y="310" width="180" height="80" rx="2"/>
  <line class="sep" x1="120" y1="338" x2="300" y2="338"/>
  <text class="title" x="210" y="330">Leaf</text>
  <text class="member" x="134" y="362">+Display(depth: int)</text>

  <!-- Composite -->
  <rect class="box" x="390" y="300" width="240" height="104" rx="2"/>
  <line class="sep" x1="390" y1="328" x2="630" y2="328"/>
  <text class="title" x="510" y="320">Composite</text>
  <text class="member" x="404" y="350">+Add(c: Component)</text>
  <text class="member" x="404" y="372">+Remove(c: Component)</text>
  <text class="member" x="404" y="394">+Display(depth: int)</text>

  <!-- 底部注释 -->
  <g>
    <path class="note" d="M20 430 H300 L314 444 V492 H20 Z"/>
    <path class="note" d="M300 430 V444 H314" fill="none"/>
    <text class="ntext" x="32" y="456">在组合中表示叶节点对象，叶节点中没有子节点</text>
  </g>
  <g>
    <path class="note" d="M350 420 H700 L714 434 V500 H350 Z"/>
    <path class="note" d="M700 420 V434 H714" fill="none"/>
    <text class="ntext" x="362" y="446">定义有枝节点行为，用来存储子部件，在</text>
    <text class="ntext" x="362" y="468">Component接口中实现与子部件有关的操</text>
    <text class="ntext" x="362" y="490">作，比如增加Add和删除Remove</text>
  </g>

  <!-- 关系 -->
  <line class="line" x1="162" y1="160" x2="274" y2="160" marker-end="url(#arrow)"/>
  <line class="dash" x1="470" y1="100" x2="440" y2="112" marker-end="url(#openArrow)"/>

  <!-- 聚合：Component 持有子部件，菱形落在 Composite 上沿 -->
  <path class="line" d="M510 172 L600 172 L600 282"/>
  <path class="hollow" d="M600 282 L609 291 L600 300 L591 291 Z"/>

  <!-- 继承：Component 底边分出 Leaf / Composite 两条支线 -->
  <path class="hollow" d="M395 220 L383 242 L407 242 Z"/>
  <path class="line" d="M395 242 L395 270 L210 270 L210 310"/>
  <path class="line" d="M395 270 L510 270 L510 300"/>

  <line class="dash" x1="205" y1="390" x2="205" y2="426" marker-end="url(#openArrow)"/>
  <line class="dash" x1="510" y1="404" x2="510" y2="416" marker-end="url(#openArrow)"/>
</svg>
