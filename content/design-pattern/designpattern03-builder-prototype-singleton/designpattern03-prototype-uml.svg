<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" role="img" aria-labelledby="t d">
  <title id="t">原型模式 UML 类图</title>
  <desc id="d">Client 通过 prototype 使用 Prototype；ConcretePrototype1/2 继承 Prototype 并实现 Clone</desc>
  <defs>
    <style>
      .box   { fill:#f3e4c4; stroke:#9c8254; stroke-width:1.2; }
      .note  { fill:#fdfaf3; stroke:#c9b89a; stroke-width:1.2; }
      .sep   { stroke:#9c8254; stroke-width:1; }
      .title { font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:20px; font-weight:700; fill:#1f1f1f; text-anchor:middle; }
      .titlei{ font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:20px; font-weight:700; font-style:italic; fill:#1f1f1f; text-anchor:middle; }
      .member{ font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:16px; fill:#1f1f1f; }
      .label { font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:16px; fill:#333333; }
      .ntext { font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:16px; fill:#1f1f1f; text-anchor:middle; }
      .line  { stroke:#1f1f1f; stroke-width:1.4; fill:none; }
      .dash  { stroke:#1f1f1f; stroke-width:1.3; fill:none; stroke-dasharray:6 4; }
      .hollow{ fill:#ffffff; stroke:#1f1f1f; stroke-width:1.4; stroke-linejoin:round; }
    </style>
    <marker id="openArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1,1 L10,6 L1,11" fill="none" stroke="#1f1f1f" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="820" height="470" fill="#ffffff"/>

  <!-- Client / Prototype -->
  <rect class="box" x="40" y="30" width="180" height="86" rx="2"/>
  <line class="sep" x1="40" y1="66" x2="220" y2="66"/>
  <text class="title" x="130" y="54">Client</text>
  <text class="member" x="56" y="90">+Operation()</text>

  <rect class="box" x="520" y="30" width="200" height="86" rx="2"/>
  <line class="sep" x1="520" y1="66" x2="720" y2="66"/>
  <text class="titlei" x="620" y="54">Prototype</text>
  <text class="member" x="536" y="90">+Clone()</text>

  <line class="line" x1="222" y1="60" x2="520" y2="60" marker-end="url(#openArrow)"/>
  <text class="label" x="240" y="50">prototype</text>

  <!-- 注释：p=prototype.Clone() -->
  <g>
    <path class="note" d="M40 160 H290 L310 180 V230 H40 Z"/>
    <path class="note" d="M290 160 V180 H310" fill="none"/>
    <text class="ntext" x="175" y="200">p=prototype.Clone()</text>
  </g>
  <line class="dash" x1="150" y1="116" x2="150" y2="160" marker-end="url(#openArrow)"/>

  <!-- ConcretePrototype1 / 2 -->
  <rect class="box" x="280" y="250" width="240" height="110" rx="2"/>
  <line class="sep" x1="280" y1="286" x2="520" y2="286"/>
  <line class="sep" x1="280" y1="320" x2="520" y2="320"/>
  <text class="title" x="400" y="273">ConcretePrototype1</text>
  <text class="member" x="296" y="348">+Clone()</text>

  <rect class="box" x="560" y="250" width="240" height="110" rx="2"/>
  <line class="sep" x1="560" y1="286" x2="800" y2="286"/>
  <line class="sep" x1="560" y1="320" x2="800" y2="320"/>
  <text class="title" x="680" y="273">ConcretePrototype2</text>
  <text class="member" x="576" y="348">+Clone()</text>

  <!-- 注释：return copy of this -->
  <g>
    <path class="note" d="M310 390 H500 L520 410 V446 H310 Z"/>
    <path class="note" d="M500 390 V410 H520" fill="none"/>
    <text class="ntext" x="415" y="426">return copy of this</text>
  </g>
  <g>
    <path class="note" d="M590 390 H780 L800 410 V446 H590 Z"/>
    <path class="note" d="M780 390 V410 H800" fill="none"/>
    <text class="ntext" x="695" y="426">return copy of this</text>
  </g>

  <!-- 关系 -->
  <path class="line" d="M400 250 L400 180 L560 180 L560 134"/>
  <path class="hollow" d="M560 116 L549 134 L571 134 Z"/>
  <path class="line" d="M680 250 L680 200 L640 200 L640 134"/>
  <path class="hollow" d="M640 116 L629 134 L651 134 Z"/>

  <line class="dash" x1="400" y1="360" x2="400" y2="390" marker-end="url(#openArrow)"/>
  <line class="dash" x1="680" y1="360" x2="680" y2="390" marker-end="url(#openArrow)"/>
</svg>
