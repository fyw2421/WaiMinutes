<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-labelledby="t d">
  <title id="t">桥接模式 UML 类图</title>
  <desc id="d">Abstraction 聚合 Implementor（implementor）；RefinedAbstraction 继承 Abstraction；ConcreteImplementorA/B 继承 Implementor</desc>
  <defs>
    <style>
      .box   { fill:#f3e4c4; stroke:#9c8254; stroke-width:1.2; }
      .note  { fill:#fdfaf3; stroke:#c9b89a; stroke-width:1.2; }
      .sep   { stroke:#9c8254; stroke-width:1; }
      .title { font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:19px; font-weight:700; fill:#1f1f1f; text-anchor:middle; }
      .titlei{ font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:19px; font-weight:700; font-style:italic; fill:#1f1f1f; text-anchor:middle; }
      .member{ font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:16px; fill:#1f1f1f; }
      .label { font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:16px; fill:#333333; }
      .ntext { font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:16px; fill:#1f1f1f; text-anchor:middle; }
      .line  { stroke:#1f1f1f; stroke-width:1.4; fill:none; }
      .dash  { stroke:#1f1f1f; stroke-width:1.3; fill:none; stroke-dasharray:6 4; }
      .hollow{ fill:#ffffff; stroke:#1f1f1f; stroke-width:1.4; stroke-linejoin:round; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f1f1f"/>
    </marker>
    <marker id="openArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1,1 L10,6 L1,11" fill="none" stroke="#1f1f1f" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="880" height="520" fill="#ffffff"/>

  <!-- Client -->
  <rect class="box" x="90" y="30" width="180" height="100" rx="2"/>
  <line class="sep" x1="90" y1="66" x2="270" y2="66"/>
  <line class="sep" x1="90" y1="98" x2="270" y2="98"/>
  <text class="title" x="180" y="54">Client</text>

  <!-- Abstraction -->
  <rect class="box" x="70" y="190" width="210" height="110" rx="2"/>
  <line class="sep" x1="70" y1="226" x2="280" y2="226"/>
  <text class="titlei" x="175" y="214">Abstraction</text>
  <text class="member" x="86" y="258">+Operation()</text>

  <!-- Implementor -->
  <rect class="box" x="580" y="190" width="250" height="110" rx="2"/>
  <line class="sep" x1="580" y1="226" x2="830" y2="226"/>
  <text class="titlei" x="705" y="214">Implementor</text>
  <text class="member" x="596" y="258">+OperationImp()</text>

  <!-- 注释：implementor.OperationImp() -->
  <g>
    <path class="note" d="M190 320 H470 L490 340 V400 H190 Z"/>
    <path class="note" d="M470 320 V340 H490" fill="none"/>
    <text class="ntext" x="330" y="370">implementor.OperationImp()</text>
  </g>

  <!-- RefinedAbstraction / ConcreteImplementorA/B -->
  <rect class="box" x="30" y="420" width="240" height="90" rx="2"/>
  <line class="sep" x1="30" y1="456" x2="270" y2="456"/>
  <line class="sep" x1="30" y1="480" x2="270" y2="480"/>
  <text class="title" x="150" y="444">RefinedAbstraction</text>

  <rect class="box" x="390" y="420" width="260" height="90" rx="2"/>
  <line class="sep" x1="390" y1="456" x2="650" y2="456"/>
  <text class="title" x="520" y="444">ConcreteImplementorA</text>
  <text class="member" x="406" y="486">+OperationImp()</text>

  <rect class="box" x="670" y="420" width="180" height="90" rx="2"/>
  <line class="sep" x1="670" y1="456" x2="850" y2="456"/>
  <text class="title" x="760" y="444">ConcreteImplementorB</text>
  <text class="member" x="686" y="486">+OperationImp()</text>

  <!-- 关系 -->
  <line class="line" x1="180" y1="130" x2="180" y2="190" marker-end="url(#arrow)"/>

  <line class="line" x1="282" y1="215" x2="580" y2="215" marker-end="url(#openArrow)"/>
  <path class="hollow" d="M282 215 L293 206 L304 215 L293 224 Z"/>
  <text class="label" x="316" y="204">implementor</text>

  <line class="dash" x1="256" y1="270" x2="256" y2="320" marker-end="url(#openArrow)"/>

  <path class="line" d="M110 420 L110 308"/>
  <path class="hollow" d="M110 290 L99 308 L121 308 Z"/>

  <path class="line" d="M520 420 L520 360 L620 360 L620 308"/>
  <path class="hollow" d="M620 290 L609 308 L631 308 Z"/>
  <path class="line" d="M760 420 L760 360 L700 360 L700 308"/>
  <path class="hollow" d="M700 290 L689 308 L711 308 Z"/>
</svg>
