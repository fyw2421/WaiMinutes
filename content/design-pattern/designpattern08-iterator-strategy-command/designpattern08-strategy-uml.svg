<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">策略模式 UML 类图</title>
  <desc id="d">Context 聚合 Strategy；ConcreteStrategyA/B/C 继承 Strategy</desc>
  <defs>
    <style>
      .box   { fill:#f3e4c4; stroke:#9c8254; stroke-width:1.2; }
      .note  { fill:#fdfaf3; stroke:#c9b89a; stroke-width:1.2; }
      .sep   { stroke:#9c8254; stroke-width:1; }
      .caption{ font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:22px; font-weight:700; fill:#1f1f1f; text-anchor:middle; }
      .title { font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:20px; font-weight:700; fill:#1f1f1f; text-anchor:middle; }
      .titlei{ font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:20px; font-weight:700; font-style:italic; fill:#1f1f1f; text-anchor:middle; }
      .member{ font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:16px; fill:#1f1f1f; }
      .label { font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:16px; fill:#333333; }
      .ntext { font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:15px; fill:#1f1f1f; }
      .line  { stroke:#1f1f1f; stroke-width:1.4; fill:none; }
      .dash  { stroke:#1f1f1f; stroke-width:1.3; fill:none; stroke-dasharray:6 4; }
      .hollow{ fill:#ffffff; stroke:#1f1f1f; stroke-width:1.4; stroke-linejoin:round; }
    </style>
    <marker id="openArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1,1 L10,6 L1,11" fill="none" stroke="#1f1f1f" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="900" height="500" fill="#ffffff"/>
  <text class="caption" x="450" y="34">策略模式（Strategy）结构图</text>

  <!-- Context -->
  <rect class="box" x="40" y="70" width="210" height="86" rx="2"/>
  <line class="sep" x1="40" y1="106" x2="250" y2="106"/>
  <text class="title" x="145" y="94">Context</text>
  <text class="member" x="56" y="130">+ContextInterface ()</text>

  <!-- Strategy -->
  <rect class="box" x="420" y="70" width="240" height="86" rx="2"/>
  <line class="sep" x1="420" y1="106" x2="660" y2="106"/>
  <text class="titlei" x="540" y="94">Strategy</text>
  <text class="member" x="436" y="130">+AlgorithmInterface ()</text>

  <!-- 注释：策略类 -->
  <g>
    <path class="note" d="M700 60 H870 L890 80 V150 H700 Z"/>
    <path class="note" d="M870 60 V80 H890" fill="none"/>
    <text class="ntext" x="714" y="92">策略类，定义所有支持</text>
    <text class="ntext" x="714" y="118">的算法的公共接口</text>
  </g>

  <!-- 聚合：Context -Strategy-> Strategy -->
  <line class="line" x1="252" y1="113" x2="420" y2="113" marker-end="url(#openArrow)"/>
  <path class="hollow" d="M252 113 L263 104 L274 113 L263 122 Z"/>
  <text class="label" x="286" y="102">-Strategy</text>
  <line class="dash" x1="698" y1="105" x2="660" y2="105" marker-end="url(#openArrow)"/>

  <!-- ConcreteStrategyA/B/C -->
  <rect class="box" x="150" y="270" width="210" height="100" rx="2"/>
  <line class="sep" x1="150" y1="306" x2="360" y2="306"/>
  <text class="title" x="255" y="293">ConcreteStrategyA</text>
  <text class="member" x="166" y="336">+AlgorithmInterface ()</text>

  <rect class="box" x="380" y="270" width="210" height="100" rx="2"/>
  <line class="sep" x1="380" y1="306" x2="590" y2="306"/>
  <text class="title" x="485" y="293">ConcreteStrategyB</text>
  <text class="member" x="396" y="336">+AlgorithmInterface ()</text>

  <rect class="box" x="610" y="270" width="210" height="100" rx="2"/>
  <line class="sep" x1="610" y1="306" x2="820" y2="306"/>
  <text class="title" x="715" y="293">ConcreteStrategyC</text>
  <text class="member" x="626" y="336">+AlgorithmInterface ()</text>

  <!-- 注释：Context 说明 / 具体策略类 -->
  <g>
    <path class="note" d="M20 390 H290 L310 410 V480 H20 Z"/>
    <path class="note" d="M290 390 V410 H310" fill="none"/>
    <text class="ntext" x="34" y="416">Context 上下文，用一个</text>
    <text class="ntext" x="34" y="440">ConcreteStrategy 来配置，</text>
    <text class="ntext" x="34" y="464">维护一个对 Strategy 对象的引用</text>
  </g>
  <g>
    <path class="note" d="M340 390 H860 L880 410 V456 H340 Z"/>
    <path class="note" d="M860 390 V410 H880" fill="none"/>
    <text class="ntext" x="356" y="428">具体策略类，封装了具体的算法或行为，继承于 Strategy</text>
  </g>

  <!-- 继承：A/B/C -> Strategy -->
  <path class="hollow" d="M540 156 L529 174 L551 174 Z"/>
  <path class="line" d="M540 174 L540 210 M255 210 L825 210 M255 210 L255 270 M485 210 L485 270 M715 210 L715 270"/>

  <line class="dash" x1="80" y1="156" x2="80" y2="390" marker-end="url(#openArrow)"/>
  <line class="dash" x1="255" y1="370" x2="352" y2="390" marker-end="url(#openArrow)"/>
  <line class="dash" x1="485" y1="370" x2="520" y2="390" marker-end="url(#openArrow)"/>
  <line class="dash" x1="715" y1="370" x2="700" y2="390" marker-end="url(#openArrow)"/>
</svg>
