<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="580" viewBox="0 0 1060 580" role="img" aria-labelledby="t d">
  <title id="t">访问者模式 UML 类图</title>
  <desc id="d">Client 使用 Visitor 与 ObjectStructure；ConcreteVisitorA/B 实现 Visitor；ConcreteElementA/B 实现 Element 并回调 Visitor</desc>
  <defs>
    <style>
      .box   { fill:#f3e4c4; stroke:#9c8254; stroke-width:1; }
      .note  { fill:#fdfaf3; stroke:#c9b89a; stroke-width:1; }
      .sep   { stroke:#9c8254; stroke-width:1; }
      .title { font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:14px; font-weight:700; fill:#1f1f1f; text-anchor:middle; }
      .titlei{ font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:14px; font-weight:700; font-style:italic; fill:#1f1f1f; text-anchor:middle; }
      .member{ font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:11px; fill:#1f1f1f; }
      .ntext { font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:11px; fill:#1f1f1f; }
      .label { font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:13px; fill:#1f1f1f; }
      .line  { stroke:#1f1f1f; stroke-width:1.1; fill:none; }
      .dash  { stroke:#1f1f1f; stroke-width:1; fill:none; stroke-dasharray:5 3; }
      .hollow{ fill:#ffffff; stroke:#1f1f1f; stroke-width:1.1; stroke-linejoin:round; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f1f1f"/>
    </marker>
    <marker id="openArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1,1 L10,6 L1,11" fill="none" stroke="#1f1f1f" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect width="1060" height="580" fill="#ffffff"/>

  <!-- Client -->
  <rect class="box" x="140" y="20" width="140" height="70" rx="2"/>
  <line class="sep" x1="140" y1="46" x2="280" y2="46"/>
  <line class="sep" x1="140" y1="68" x2="280" y2="68"/>
  <text class="title" x="210" y="38">Client</text>

  <!-- Visitor -->
  <rect class="box" x="430" y="20" width="450" height="90" rx="2"/>
  <line class="sep" x1="430" y1="50" x2="880" y2="50"/>
  <text class="titlei" x="655" y="40">Visitor</text>
  <text class="member" x="442" y="70">+visitConcreteElementA(elem: ConcreteElementA)</text>
  <text class="member" x="442" y="92">+visitConcreteElementB(elem: ConcreteElementB)</text>

  <!-- ObjectStructure -->
  <rect class="box" x="100" y="180" width="190" height="90" rx="2"/>
  <line class="sep" x1="100" y1="208" x2="290" y2="208"/>
  <text class="title" x="195" y="200">ObjectStructure</text>
  <text class="member" x="114" y="228">-elements: List&lt;Element&gt;</text>
  <text class="member" x="114" y="252">+accept(v: Visitor)</text>

  <!-- 左侧注释 -->
  <g>
    <path class="note" d="M10 300 H200 L214 314 V384 H10 Z"/>
    <path class="note" d="M200 300 V314 H214" fill="none"/>
    <text class="ntext" x="22" y="326">for(Element e : elements){</text>
    <text class="ntext" x="30" y="350">e.accept(v);</text>
    <text class="ntext" x="22" y="374">}</text>
  </g>

  <!-- ConcreteVisitor A / B -->
  <rect class="box" x="300" y="200" width="330" height="90" rx="2"/>
  <line class="sep" x1="300" y1="228" x2="630" y2="228"/>
  <text class="title" x="465" y="220">ConcreteVisitorA</text>
  <text class="member" x="312" y="248">+visitConcreteElementA(elem: ConcreteElementA)</text>
  <text class="member" x="312" y="270">+visitConcreteElementB(elem: ConcreteElementB)</text>

  <rect class="box" x="660" y="200" width="310" height="90" rx="2"/>
  <line class="sep" x1="660" y1="228" x2="970" y2="228"/>
  <text class="title" x="815" y="220">ConcreteVisitorB</text>
  <text class="member" x="672" y="248">+visitConcreteElementA(elem: ConcreteElementA)</text>
  <text class="member" x="672" y="270">+visitConcreteElementB(elem: ConcreteElementB)</text>

  <!-- Element / ConcreteElementB -->
  <rect class="box" x="340" y="330" width="200" height="80" rx="2"/>
  <line class="sep" x1="340" y1="358" x2="540" y2="358"/>
  <text class="titlei" x="440" y="350">Element</text>
  <text class="member" x="354" y="380">+accept(v: Visitor)</text>

  <rect class="box" x="590" y="330" width="190" height="80" rx="2"/>
  <line class="sep" x1="590" y1="358" x2="780" y2="358"/>
  <text class="title" x="685" y="350">ConcreteElementB</text>
  <text class="member" x="604" y="378">+accept(v: Visitor)</text>
  <text class="member" x="604" y="398">+operationB()</text>

  <!-- ConcreteElementA -->
  <rect class="box" x="340" y="470" width="240" height="90" rx="2"/>
  <line class="sep" x1="340" y1="498" x2="580" y2="498"/>
  <text class="title" x="460" y="490">ConcreteElementA</text>
  <text class="member" x="354" y="518">+accept(v: Visitor)</text>
  <text class="member" x="354" y="540">+operationA()</text>

  <!-- 注释：回调 -->
  <g>
    <path class="note" d="M800 330 H1046 L1060 344 V390 H800 Z"/>
    <path class="note" d="M1046 330 V344 H1060" fill="none"/>
    <text class="ntext" x="812" y="362">v.visitConcreteElementB(this);</text>
  </g>
  <g>
    <path class="note" d="M620 480 H766 L780 494 V540 H620 Z"/>
    <path class="note" d="M766 480 V494 H780" fill="none"/>
    <text class="ntext" x="630" y="512">v.visitConcreteElementA(this);</text>
  </g>

  <!-- 关系 -->
  <line class="line" x1="282" y1="45" x2="424" y2="45" marker-end="url(#arrow)"/>
  <line class="line" x1="200" y1="90" x2="200" y2="174" marker-end="url(#arrow)"/>
  <line class="dash" x1="150" y1="270" x2="150" y2="300"/>

  <!-- ObjectStructure -> Element：从下方拐入 Element 左边缘，标注 * -->
  <path class="line" d="M285 270 L285 350 L334 350" marker-end="url(#arrow)"/>
  <text class="label" x="298" y="340">*</text>

  <!-- ConcreteVisitorA/B 虚线继承 Visitor -->
  <path class="dash" d="M460 200 L460 160 L600 160 L600 134"/>
  <path class="hollow" d="M600 110 L589 132 L611 132 Z"/>
  <path class="dash" d="M770 200 L770 160 L700 160 L700 134"/>
  <path class="hollow" d="M700 110 L689 132 L711 132 Z"/>

  <!-- 继承：ConcreteElementA 指向 Element 底边 -->
  <path class="dash" d="M440 428 L440 470"/>
  <path class="hollow" d="M440 410 L429 428 L451 428 Z"/>

  <!-- 继承：ConcreteElementB 三角指向 Element 右边框 -->
  <line class="dash" x1="590" y1="370" x2="558" y2="370"/>
  <path class="hollow" d="M540 370 L558 361 L558 379 Z"/>

  <line class="dash" x1="782" y1="360" x2="800" y2="360"/>
  <line class="dash" x1="582" y1="510" x2="620" y2="510"/>
</svg>
