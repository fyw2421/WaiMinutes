<svg xmlns="http://www.w3.org/2000/svg" width="900" height="630" viewBox="0 0 900 630" role="img" aria-labelledby="t d">
  <title id="t">解释器模式 UML 类图</title>
  <desc id="d">Client 使用 Context 与 AbstractExpression；TerminalExpression 与 NonterminalExpression 继承 AbstractExpression，后者递归聚合表达式</desc>
  <defs>
    <style>
      .box   { fill:#f3e4c4; stroke:#9c8254; stroke-width:1; }
      .note  { fill:#fdfaf3; stroke:#c9b89a; stroke-width:1; }
      .sep   { stroke:#9c8254; stroke-width:1; }
      .caption{ font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:20px; font-weight:700; fill:#1f1f1f; text-anchor:middle; }
      .title { font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:15px; font-weight:700; fill:#1f1f1f; text-anchor:middle; }
      .titlei{ font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:15px; font-weight:700; font-style:italic; fill:#1f1f1f; text-anchor:middle; }
      .member{ font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:12px; fill:#1f1f1f; }
      .ntext { font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif; font-size:12px; fill:#1f1f1f; }
      .line  { stroke:#1f1f1f; stroke-width:1.1; fill:none; }
      .dash  { stroke:#1f1f1f; stroke-width:1; fill:none; stroke-dasharray:5 3; }
      .hollow{ fill:#ffffff; stroke:#1f1f1f; stroke-width:1.1; stroke-linejoin:round; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f1f1f"/>
    </marker>
    <marker id="openArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1,1 L10,6 L1,11" fill="none" stroke="#1f1f1f" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect width="900" height="630" fill="#ffffff"/>
  <text class="caption" x="450" y="30">解释器模式（interpreter）结构图</text>

  <!-- 顶部注释 -->
  <g>
    <path class="note" d="M490 55 H860 L874 69 V115 H490 Z"/>
    <path class="note" d="M860 55 V69 H874" fill="none"/>
    <text class="ntext" x="502" y="90">包含解释器之外的一些全局信息</text>
  </g>

  <!-- Client / Context -->
  <rect class="box" x="30" y="130" width="120" height="90" rx="2"/>
  <line class="sep" x1="30" y1="160" x2="150" y2="160"/>
  <line class="sep" x1="30" y1="190" x2="150" y2="190"/>
  <text class="title" x="90" y="152">Client</text>

  <rect class="box" x="280" y="130" width="160" height="90" rx="2"/>
  <line class="sep" x1="280" y1="160" x2="440" y2="160"/>
  <line class="sep" x1="280" y1="190" x2="440" y2="190"/>
  <text class="title" x="360" y="152">Context</text>

  <!-- 右侧注释 -->
  <g>
    <path class="note" d="M500 140 H860 L874 154 V216 H500 Z"/>
    <path class="note" d="M860 140 V154 H874" fill="none"/>
    <text class="ntext" x="512" y="166">抽象表达式，声明一个抽象的解释操作，</text>
    <text class="ntext" x="512" y="192">这个接口为抽象语法树中所有的节点所共享</text>
  </g>

  <!-- AbstractExpression -->
  <rect class="box" x="320" y="290" width="380" height="90" rx="2"/>
  <line class="sep" x1="320" y1="322" x2="700" y2="322"/>
  <text class="titlei" x="510" y="312">AbstractExpression</text>
  <text class="member" x="334" y="350">+Interpret (in context  :  Context)</text>

  <!-- 两个具体表达式 -->
  <rect class="box" x="140" y="430" width="320" height="80" rx="2"/>
  <line class="sep" x1="140" y1="462" x2="460" y2="462"/>
  <text class="title" x="300" y="452">TerminalExpression</text>
  <text class="member" x="154" y="488">+Interpret (in context  :  Context)</text>

  <rect class="box" x="490" y="430" width="380" height="80" rx="2"/>
  <line class="sep" x1="490" y1="462" x2="870" y2="462"/>
  <text class="title" x="680" y="452">NonterminalExpression</text>
  <text class="member" x="504" y="488">+Interpret (in context  :  Context)</text>

  <!-- 底部注释 -->
  <g>
    <path class="note" d="M20 545 H320 L334 559 V610 H20 Z"/>
    <path class="note" d="M320 545 V559 H334" fill="none"/>
    <text class="ntext" x="32" y="572">终结符表达式，实现与文法中的</text>
    <text class="ntext" x="32" y="596">终结符相关联的解释操作</text>
  </g>
  <g>
    <path class="note" d="M360 540 H880 L894 554 V618 H360 Z"/>
    <path class="note" d="M880 540 V554 H894" fill="none"/>
    <text class="ntext" x="372" y="564">非终结符表达式，为文法中的非终结符实现解释操作。</text>
    <text class="ntext" x="372" y="588">对文法中每一条规则R1、R2……Rn都需要一个具体的</text>
    <text class="ntext" x="372" y="612">非终结符表达式类</text>
  </g>

  <!-- 关系 -->
  <!-- Client -> Context / AbstractExpression：落在目标类框侧边中部 -->
  <line class="line" x1="152" y1="175" x2="274" y2="175" marker-end="url(#arrow)"/>
  <path class="line" d="M90 220 L90 335 L314 335" marker-end="url(#arrow)"/>

  <!-- 注释引出线：纯虚线，不带箭头 -->
  <line class="dash" x1="500" y1="95" x2="420" y2="130"/>
  <line class="dash" x1="600" y1="218" x2="560" y2="290"/>

  <!-- 继承：两个具体表达式共用横档指向 AbstractExpression -->
  <path class="hollow" d="M510 380 L498 402 L522 402 Z"/>
  <path class="line" d="M510 402 L510 415 L300 415 L300 430"/>
  <path class="line" d="M510 415 L680 415 L680 430"/>

  <!-- 聚合：菱形落在 NonterminalExpression 右边框 -->
  <path class="line" d="M700 335 L881 335 L881 461"/>
  <path class="hollow" d="M881 461 L892 470 L881 479 L870 470 Z"/>

  <!-- 底部注释引出线：纯虚线 -->
  <line class="dash" x1="290" y1="510" x2="290" y2="545"/>
  <line class="dash" x1="680" y1="510" x2="680" y2="540"/>
</svg>
