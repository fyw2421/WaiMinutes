<svg xmlns="http://www.w3.org/2000/svg" width="410" height="280" viewBox="0 0 410 280" role="img" aria-labelledby="t d">
  <title id="t">沙发床类结构</title>
  <desc id="d">SleeperSofa（沙发床）同时继承 Bed（床）与 Sofa（沙发），两份 weight 成员会造成数据冗余与二义性</desc>
  <defs>
    <style>
      .box   { fill:#ffffff; stroke:#1f1f1f; stroke-width:1.2; }
      .ln    { stroke:#1f1f1f; stroke-width:1.2; fill:none; }
      .lbl   { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:13px; fill:#1f1f1f; }
      .ttl   { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:13px; font-weight:700; fill:#1f1f1f; text-anchor:middle; }
      .cap   { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:13px; fill:#1f1f1f; text-anchor:middle; }
    </style>
  </defs>
  <rect width="410" height="280" fill="#ffffff"/>

  <!-- Bed -->
  <rect class="box" x="68" y="18" width="112" height="90"/>
  <text class="ttl" x="124" y="42">Bed（床）</text>
  <text class="lbl" x="132" y="76">weight</text>
  <rect class="box" x="8" y="44" width="92" height="20"/>
  <text class="lbl" x="54" y="59" text-anchor="middle">sleep()</text>
  <rect class="box" x="8" y="72" width="92" height="20"/>
  <text class="lbl" x="54" y="87" text-anchor="middle">setWeight()</text>

  <!-- Sofa -->
  <rect class="box" x="292" y="18" width="112" height="90"/>
  <text class="ttl" x="348" y="42">Sofa（沙发）</text>
  <text class="lbl" x="356" y="76">weight</text>
  <rect class="box" x="244" y="44" width="98" height="20"/>
  <text class="lbl" x="293" y="59" text-anchor="middle">watchTV()</text>
  <rect class="box" x="244" y="72" width="98" height="20"/>
  <text class="lbl" x="293" y="87" text-anchor="middle">setWeight()</text>

  <!-- SleeperSofa -->
  <rect class="box" x="168" y="168" width="157" height="60"/>
  <text class="ttl" x="247" y="188">SleeperSofa</text>
  <text class="lbl" x="283" y="212" text-anchor="middle">（沙发床）</text>
  <rect class="box" x="118" y="194" width="112" height="24"/>
  <text class="lbl" x="174" y="211" text-anchor="middle">foldOut()</text>

  <!-- 继承线 -->
  <path class="ln" d="M124 108 L206 168"/>
  <path class="ln" d="M348 108 L288 168"/>

  <text class="cap" x="205" y="266">图 10-5　沙发床类结构</text>
</svg>
