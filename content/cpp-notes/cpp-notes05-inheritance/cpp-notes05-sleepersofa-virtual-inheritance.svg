<svg xmlns="http://www.w3.org/2000/svg" width="224" height="196" viewBox="0 0 224 196" role="img" aria-labelledby="t d">
  <title id="t">虚拟继承的 SleeperSofa 对象</title>
  <desc id="d">虚拟继承后，SleeperSofa 对象本体中 Furniture 部分只出现一次，随后依次是 Bed 部分、Sofa 部分、SleeperSofa 部分</desc>
  <defs>
