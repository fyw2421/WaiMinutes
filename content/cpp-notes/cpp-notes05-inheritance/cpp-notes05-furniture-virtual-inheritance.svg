<svg xmlns="http://www.w3.org/2000/svg" width="430" height="356" viewBox="0 0 430 356" role="img" aria-labelledby="t d">
  <title id="t">沙发床的理想继承结构</title>
  <desc id="d">Furniture（家具）派生 Bed（床）与 Sofa（沙发），二者再共同派生出 SleeperSofa（沙发床）</desc>
  <defs>
    <style>
      .box   { fill:#ffffff; stroke:#1f1f1f; stroke-width:1.2; }
      .feat  { fill:#ffffff; stroke:#1f1f1f; stroke-width:1.2; }
      .ln    { stroke:#1f1f1f; stroke-width:1.2; fill:none; }
      .lbl   { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:13px; fill:#1f1f1f; }
      .ttl   { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:13px; font-weight:700; fill:#1f1f1f; text-anchor:middle; }
      .cap   { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:13px; fill:#1f1f1f; text-anchor:middle; }
    </style>
  </defs>
  <rect width="430" height="356" fill="#ffffff"/>

  <!-- Furniture -->
  <rect class="box" x="160" y="20" width="150" height="76"/>
  <text class="ttl" x="235" y="42">Furniture（家具）</text>
  <text class="lbl" x="252" y="74">weight</text>
  <rect class="feat" x="118" y="50" width="92" height="20"/>
  <text class="lbl" x="164" y="65" text-anchor="middle">getWeight()</text>
  <rect class="feat" x="118" y="78" width="92" height="20"/>
  <text class="lbl" x="164" y="93" text-anchor="middle">setWeight()</text>

  <!-- Bed -->
  <rect class="box" x="48" y="152" width="164" height="66"/>
  <text class="ttl" x="130" y="176">Bed（床）</text>
  <text class="lbl" x="152" y="202">weight</text>
  <rect class="feat" x="16" y="176" width="96" height="22"/>
  <text class="lbl" x="64" y="192" text-anchor="middle">sleep()</text>

  <!-- Sofa -->
  <rect class="box" x="250" y="152" width="162" height="66"/>
  <text class="ttl" x="331" y="176">Sofa（沙发）</text>
  <text class="lbl" x="345" y="202">weight</text>
  <rect class="feat" x="238" y="180" width="98" height="22"/>
  <text class="lbl" x="287" y="196" text-anchor="middle">watchTV()</text>

  <!-- SleeperSofa -->
  <rect class="box" x="162" y="266" width="148" height="54"/>
  <text class="ttl" x="236" y="288">SleeperSofa</text>
  <text class="lbl" x="252" y="310">（沙发床）</text>
  <rect class="feat" x="126" y="292" width="92" height="22"/>
  <text class="lbl" x="172" y="308" text-anchor="middle">FoldOut()</text>

  <!-- 继承线 -->
  <path class="ln" d="M235 96 L130 152"/>
  <path class="ln" d="M235 96 L331 152"/>
  <path class="ln" d="M130 218 L236 266"/>
  <path class="ln" d="M331 218 L236 266"/>

  <text class="cap" x="215" y="344">图 10-7　沙发床的理想继承结构</text>
</svg>
