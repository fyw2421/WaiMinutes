<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" role="img" aria-labelledby="t d">
  <title id="t">线程安全的三个层次</title>
  <desc id="d">从低到高分别是原子操作、锁同步与不可变对象。共享可变状态是并发的根本问题，用不可变对象和并发容器可以避开大部分同步需求</desc>
  <defs>
    <style>
      .hd   { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:15px; font-weight:600; fill:#1f1f1f; }
      .lbl  { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:13px; fill:#1f1f1f; }
      .code { font-family:Consolas,'Cascadia Mono',Menlo,monospace; font-size:12px; fill:#1f1f1f; }
      .note { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:11px; fill:#5a6572; }
      .l1   { fill:#eefaf0; stroke:#5cb87a; stroke-width:1.6; }
      .l2   { fill:#eef4ff; stroke:#7aa5e8; stroke-width:1.6; }
      .l3   { fill:#fff6e8; stroke:#e0a458; stroke-width:1.6; }
      .bad  { fill:#fdeeee; stroke:#d98b8b; stroke-width:1.4; }
      .ok   { fill:#eefaf0; stroke:#5cb87a; stroke-width:1.4; }
      .line { stroke:#7a8899; stroke-width:1.3; fill:none; }
    </style>
  </defs>
  <rect width="820" height="400" fill="#ffffff"/>
  <text class="hd" x="16" y="24">共享可变状态是并发的根源，方案从低到高有三层</text>

  <!-- 第一层 -->
  <rect class="l1" x="16" y="38" width="788" height="104" rx="8"/>
  <text class="lbl" x="32" y="62" font-weight="600">① 原子操作：不需要锁</text>
  <text class="note" x="32" y="82">适用于「读-改-写」这类复合操作。JDK 的 java.util.concurrent.atomic 提供无锁方案</text>

  <rect class="ok" x="32" y="92" width="290" height="38" rx="5"/>
  <text class="code" x="44" y="110">AtomicInteger c = new AtomicInteger();</text>
  <text class="code" x="44" y="126">c.incrementAndGet();</text>

  <rect class="bad" x="332" y="92" width="290" height="38" rx="5"/>
  <text class="code" x="344" y="110">private int count = 0;</text>
  <text class="code" x="344" y="126">count++;   // 读 → 加 → 写，中间会丢</text>

  <text class="note" x="632" y="110">volatile 不行：</text>
  <text class="note" x="632" y="128">只保证可见性</text>

  <!-- 第二层 -->
  <rect class="l2" x="16" y="154" width="788" height="108" rx="8"/>
  <text class="lbl" x="32" y="178" font-weight="600">② 锁同步：互斥访问</text>
  <text class="note" x="32" y="198">临界区内不要做耗时 IO 或调用外部服务，否则会把锁持有时间拉长，吞吐急剧下降</text>

  <rect class="ok" x="32" y="208" width="290" height="42" rx="5"/>
  <text class="code" x="44" y="226">public synchronized int get() {</text>
  <text class="code" x="44" y="242">    return count; }</text>

  <rect class="ok" x="332" y="208" width="290" height="42" rx="5"/>
  <text class="code" x="344" y="226">synchronized (this) {</text>
  <text class="code" x="344" y="242">    count++; }  // 缩小锁范围</text>

  <text class="note" x="632" y="224">锁对象要私有，否则</text>
  <text class="note" x="632" y="242">外部可自己加同一把锁</text>

  <!-- 第三层 -->
  <rect class="l3" x="16" y="274" width="788" height="78" rx="8"/>
  <text class="lbl" x="32" y="298" font-weight="600">③ 不可变对象：从根上消除竞争（最推荐）</text>
  <text class="note" x="32" y="318">字段全部 final、构造完成后不再改变 → 任何线程读到的值都一致，不需要任何同步</text>

  <rect class="ok" x="32" y="326" width="290" height="20" rx="4"/>
  <text class="code" x="44" y="341">record Point(int x, int y) {}</text>
  <rect class="ok" x="332" y="326" width="290" height="20" rx="4"/>
  <text class="code" x="344" y="341">Collections.unmodifiableList(list)</text>

  <line x1="16" y1="364" x2="804" y2="364" stroke="#e0e4e9" stroke-width="1"/>
  <text class="note" x="16" y="384">优先选 ③ —— 不可变数据天然线程安全，且省去了锁带来的开销；能用不可变表达的就不要用可变 + 锁</text>
</svg>
