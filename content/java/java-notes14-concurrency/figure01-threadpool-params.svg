<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" role="img" aria-labelledby="t d">
  <title id="t">线程池的七个参数与任务流向</title>
  <desc id="d">任务提交时依次判断：核心线程、任务队列、扩到最大线程，最后触发拒绝策略。队列必须有界，否则任务堆积会耗尽内存</desc>
  <defs>
    <style>
      .hd   { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:15px; font-weight:600; fill:#1f1f1f; }
      .lbl  { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:13px; fill:#1f1f1f; }
      .code { font-family:Consolas,'Cascadia Mono',Menlo,monospace; font-size:12px; fill:#1f1f1f; }
      .note { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:11px; fill:#5a6572; }
      .core { fill:#eefaf0; stroke:#5cb87a; stroke-width:1.6; }
      .q    { fill:#eef4ff; stroke:#7aa5e8; stroke-width:1.6; }
      .max  { fill:#fff6e8; stroke:#e0a458; stroke-width:1.6; }
      .rej  { fill:#fdeeee; stroke:#d98b8b; stroke-width:1.6; }
      .task { fill:#f5f7fa; stroke:#c9d2dd; stroke-width:1.3; }
      .line { stroke:#7a8899; stroke-width:1.4; fill:none; }
    </style>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a8899"/>
    </marker>
  </defs>
  <rect width="820" height="400" fill="#ffffff"/>
  <text class="hd" x="16" y="24">任务提交时的判断顺序</text>

  <rect class="task" x="16" y="52" width="110" height="32" rx="6"/>
  <text class="code" x="40" y="73">新任务</text>

  <line x1="130" y1="68" x2="176" y2="68" class="line" marker-end="url(#arw)"/>

  <!-- 步骤 1 -->
  <rect class="core" x="180" y="46" width="150" height="44" rx="6"/>
  <text class="code" x="192" y="66">1. 核心线程</text>
  <text class="note" x="192" y="84">线程数 &lt; corePoolSize？</text>

  <line x1="334" y1="68" x2="380" y2="68" class="line" marker-end="url(#arw)"/>
  <text class="note" x="336" y="60">是→创建并执行</text>

  <!-- 步骤 2 -->
  <rect class="q" x="180" y="110" width="150" height="44" rx="6"/>
  <text class="code" x="192" y="130">2. 任务队列</text>
  <text class="note" x="192" y="148">队列没满？入队</text>

  <line x1="334" y1="132" x2="380" y2="132" class="line" marker-end="url(#arw)"/>
  <text class="note" x="336" y="124">是→排队等待</text>

  <!-- 步骤 3 -->
  <rect class="max" x="180" y="174" width="150" height="44" rx="6"/>
  <text class="code" x="192" y="194">3. 扩到最大</text>
  <text class="note" x="192" y="212">&lt; maximumPoolSize？新建</text>

  <line x1="334" y1="196" x2="380" y2="196" class="line" marker-end="url(#arw)"/>
  <text class="note" x="336" y="188">是→创建并执行</text>

  <!-- 步骤 4 -->
  <rect class="rej" x="180" y="238" width="150" height="44" rx="6"/>
  <text class="code" x="192" y="258">4. 拒绝策略</text>
  <text class="note" x="192" y="276">handler 决定怎么办</text>

  <line x1="255" y1="94" x2="255" y2="106" class="line" marker-end="url(#arw)"/>
  <line x1="255" y1="158" x2="255" y2="170" class="line" marker-end="url(#arw)"/>
  <line x1="255" y1="222" x2="255" y2="234" class="line" marker-end="url(#arw)"/>

  <!-- 右侧说明 -->
  <rect class="task" x="400" y="46" width="404" height="112" rx="8"/>
  <text class="lbl" x="414" y="70" font-weight="600">七个参数</text>
  <text class="code" x="414" y="92">corePoolSize, maximumPoolSize,</text>
  <text class="code" x="414" y="110">keepAliveTime + unit, workQueue,</text>
  <text class="code" x="414" y="128">threadFactory, handler</text>
  <text class="note" x="414" y="150">核心线程空闲也不回收；非核心线程 keepAliveTime 后回收</text>

  <rect class="rej" x="400" y="174" width="404" height="108" rx="8"/>
  <text class="lbl" x="414" y="198" font-weight="600">为什么不用 Executors 的工厂方法</text>
  <text class="note" x="414" y="220">newFixedThreadPool / newSingleThreadExecutor 用的是无界队列</text>
  <text class="note" x="414" y="240">newCachedThreadPool 的线程数无界</text>
  <text class="note" x="414" y="262">任务持续堆积 → 内存耗尽 → OutOfMemoryError，无法通过调参缓解</text>
  <text class="note" x="414" y="278">生产环境一律自己 new ThreadPoolExecutor，四项参数全部显式指定</text>

  <line x1="16" y1="310" x2="804" y2="310" stroke="#e0e4e9" stroke-width="1"/>
  <text class="note" x="16" y="332">务必设置：① 有界队列 ArrayBlockingQueue ② 显式拒绝策略（反压首选 CallerRunsPolicy）</text>
  <text class="note" x="16" y="352">③ 有业务含义的线程名（ThreadFactory）  ④ UncaughtExceptionHandler，否则线程静默死亡、任务永无结果</text>
  <text class="note" x="16" y="376">线程池应当按业务隔离：核心链路与普通任务分开，慢任务才不会拖垮全部线程</text>
</svg>
