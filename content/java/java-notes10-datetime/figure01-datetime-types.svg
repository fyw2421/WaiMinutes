<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" role="img" aria-labelledby="t d">
  <title id="t">java.time 的类型划分</title>
  <desc id="d">java.time 按是否含时区与表示的时间量分为三类：无时区的本地类型、含时区的 Zoned 与 Offset 类型、时间线瞬时点 Instant，以及时间量 Duration 与日期量 Period</desc>
  <defs>
    <style>
      .hd   { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:15px; font-weight:600; fill:#1f1f1f; }
      .lbl  { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:13px; fill:#1f1f1f; }
      .code { font-family:Consolas,'Cascadia Mono',Menlo,monospace; font-size:12px; fill:#1f1f1f; }
      .note { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:12px; fill:#5a6572; }
      .grp  { fill:#eef2f6; stroke:#8b98a8; stroke-width:1.4; }
      .local{ fill:#eef4ff; stroke:#7aa5e8; stroke-width:1.3; }
      .zoned{ fill:#eefaf0; stroke:#5cb87a; stroke-width:1.3; }
      .inst { fill:#fff6e8; stroke:#e0a458; stroke-width:1.3; }
      .warn { fill:#fdeeee; stroke:#d98b8b; stroke-width:1.3; }
    </style>
  </defs>
  <rect width="820" height="360" fill="#ffffff"/>
  <text class="hd" x="16" y="24">java.time：按"是否含时区"划分</text>

  <!-- 第一组 无时区 -->
  <rect class="grp" x="16" y="38" width="252" height="128" rx="8"/>
  <text class="lbl" x="30" y="60" font-weight="600">无时区（本地时间）</text>
  <text class="note" x="30" y="78">适合业务场景：生日、账期、营业时间</text>

  <rect class="local" x="30" y="88" width="106" height="24" rx="4"/>
  <text class="code" x="40" y="105">LocalDate</text>
  <rect class="local" x="144" y="88" width="106" height="24" rx="4"/>
  <text class="code" x="154" y="105">LocalTime</text>
  <rect class="local" x="30" y="118" width="220" height="24" rx="4"/>
  <text class="code" x="40" y="135">LocalDateTime</text>
  <text class="note" x="30" y="158">最常用。不含时区，换时区展示时刻不变</text>

  <!-- 第二组 含时区 -->
  <rect class="grp" x="284" y="38" width="252" height="128" rx="8"/>
  <text class="lbl" x="298" y="60" font-weight="600">含时区</text>
  <text class="note" x="298" y="78">需要"某地此刻"的场景</text>

  <rect class="zoned" x="298" y="88" width="220" height="24" rx="4"/>
  <text class="code" x="308" y="105">ZonedDateTime</text>
  <text class="note" x="298" y="126">带区域（Asia/Shanghai），自动处理夏令时</text>

  <rect class="zoned" x="298" y="134" width="220" height="24" rx="4"/>
  <text class="code" x="308" y="151">OffsetDateTime</text>

  <!-- 第三组 瞬时 -->
  <rect class="grp" x="552" y="38" width="252" height="128" rx="8"/>
  <text class="lbl" x="566" y="60" font-weight="600">时间线上的瞬时点</text>
  <text class="note" x="566" y="78">与时区无关的绝对时刻</text>

  <rect class="inst" x="566" y="88" width="220" height="24" rx="4"/>
  <text class="code" x="576" y="105">Instant</text>
  <text class="note" x="566" y="126">存时间戳、写日志首选</text>
  <text class="note" x="566" y="146">转换需显式给 ZoneId</text>

  <!-- 时间量 -->
  <rect class="grp" x="16" y="178" width="388" height="82" rx="8"/>
  <text class="lbl" x="30" y="200" font-weight="600">时间量：Duration / Period</text>
  <rect class="local" x="30" y="210" width="160" height="24" rx="4"/>
  <text class="code" x="40" y="227">Duration</text>
  <text class="note" x="130" y="227">秒 分 小时</text>
  <rect class="local" x="202" y="210" width="186" height="24" rx="4"/>
  <text class="code" x="212" y="227">Period</text>
  <text class="note" x="278" y="227">年 月 日</text>
  <text class="note" x="30" y="252">两个日期相隔多久用 Period（受闰年大小月影响）</text>

  <!-- 常见错误 -->
  <rect class="grp" x="416" y="178" width="388" height="82" rx="8"/>
  <text class="lbl" x="430" y="200" font-weight="600">旧 API 的三个坑</text>
  <text class="note" x="430" y="220">Date：月份从 0 开始，且可变、线程不安全</text>
  <text class="note" x="430" y="238">SimpleDateFormat 非线程安全，多线程共用必然出错</text>
  <text class="note" x="430" y="256">自己加减小时数：跨夏令时会算错</text>

  <line x1="16" y1="278" x2="804" y2="278" stroke="#e0e4e9" stroke-width="1"/>
  <text class="lbl" x="16" y="300" font-weight="600">使用原则</text>
  <text class="note" x="16" y="322">• 跨时区系统统一用 Instant（或 UTC 的 LocalDateTime）存储，展示时再转本地时区</text>
  <text class="note" x="16" y="342">• 生产环境显式指定时区，不要依赖 LocalDateTime.now() 的系统默认值</text>
</svg>
