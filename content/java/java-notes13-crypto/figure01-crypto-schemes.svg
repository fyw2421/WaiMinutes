<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" role="img" aria-labelledby="t d">
  <title id="t">对称加密与非对称加密的分工</title>
  <desc id="d">对称加密速度快但密钥分发困难，非对称加密解决密钥分发但速度慢。实际系统用混合方案：一次性 AES 密钥加密数据，再用 RSA 公钥加密该密钥</desc>
  <defs>
    <style>
      .hd   { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:15px; font-weight:600; fill:#1f1f1f; }
      .lbl  { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:13px; fill:#1f1f1f; }
      .code { font-family:Consolas,'Cascadia Mono',Menlo,monospace; font-size:12px; fill:#1f1f1f; }
      .note { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:12px; fill:#5a6572; }
      .sym  { fill:#eef4ff; stroke:#7aa5e8; stroke-width:1.4; }
      .asym { fill:#eefaf0; stroke:#5cb87a; stroke-width:1.4; }
      .mix  { fill:#fff6e8; stroke:#e0a458; stroke-width:1.4; }
      .bad  { fill:#fdeeee; stroke:#d98b8b; stroke-width:1.3; }
      .box  { fill:#f5f7fa; stroke:#c9d2dd; stroke-width:1.4; }
      .line { stroke:#7a8899; stroke-width:1.4; fill:none; }
    </style>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a8899"/>
    </marker>
  </defs>
  <rect width="820" height="400" fill="#ffffff"/>
  <text class="hd" x="16" y="24">两类算法各有所长，所以要混着用</text>

  <!-- 对称 -->
  <rect class="sym" x="16" y="38" width="386" height="140" rx="8"/>
  <text class="lbl" x="32" y="62" font-weight="600">对称加密（AES）</text>
  <text class="note" x="32" y="80">同一把密钥加解密，速度快</text>

  <rect class="box" x="32" y="92" width="104" height="30" rx="5"/>
  <text class="code" x="44" y="112">明文</text>
  <line x1="140" y1="107" x2="176" y2="107" class="line" marker-end="url(#arw)"/>
  <rect class="box" x="180" y="92" width="130" height="30" rx="5"/>
  <text class="code" x="192" y="112">AES(密钥)</text>
  <line x1="314" y1="107" x2="350" y2="107" class="line" marker-end="url(#arw)"/>
  <rect class="box" x="354" y="92" width="34" height="30" rx="5"/>
  <text class="code" x="360" y="112">密</text>

  <text class="note" x="32" y="144">优点：快，适合大数据</text>
  <text class="note" x="32" y="164">缺点：★密钥怎么安全送到对方手里？这是根本难题</text>

  <!-- 非对称 -->
  <rect class="asym" x="418" y="38" width="386" height="140" rx="8"/>
  <text class="lbl" x="434" y="62" font-weight="600">非对称加密（RSA / ECC）</text>
  <text class="note" x="434" y="80">公钥加密、私钥解密，无共享密钥</text>

  <rect class="box" x="434" y="92" width="104" height="30" rx="5"/>
  <text class="code" x="446" y="112">明文</text>
  <line x1="542" y1="107" x2="578" y2="107" class="line" marker-end="url(#arw)"/>
  <rect class="box" x="582" y="92" width="130" height="30" rx="5"/>
  <text class="code" x="594" y="112">RSA(公钥)</text>
  <line x1="716" y1="107" x2="752" y2="107" class="line" marker-end="url(#arw)"/>
  <rect class="box" x="756" y="92" width="34" height="30" rx="5"/>
  <text class="code" x="762" y="112">密</text>

  <text class="note" x="434" y="144">优点：公钥可公开，解决了密钥分发问题</text>
  <text class="note" x="434" y="164">缺点：★慢，且明文长度受密钥长度限制（2048 位仅约 245 字节）</text>

  <line x1="16" y1="192" x2="804" y2="192" stroke="#e0e4e9" stroke-width="1"/>

  <!-- 混合 -->
  <text class="hd" x="16" y="216">实际做法：混合加密（TLS 就是这么工作的）</text>

  <rect class="mix" x="16" y="228" width="788" height="96" rx="8"/>

  <text class="note" x="32" y="250">1. 随机生成一把一次性的 AES 密钥 K</text>
  <text class="note" x="32" y="270">2. 用 K 加密真实数据（快）　　　　→ 得到 密文数据</text>
  <text class="note" x="32" y="290">3. 用接收方的 RSA 公钥加密 K（慢，但 K 很短）→ 得到 密钥密文</text>
  <text class="note" x="32" y="312">4. 传输 ( 密钥密文 || 密文数据 )，接收方用私钥解出 K，再解数据</text>

  <rect class="bad" x="16" y="336" width="788" height="48" rx="6"/>
  <text class="note" x="32" y="358">★ 三个必须避免的写法：</text>
  <text class="note" x="32" y="378">Cipher.getInstance("AES") 默认 ECB 模式｜用 MD5/SHA-1 做安全校验｜用 java.util.Random 生成令牌或密钥</text>
</svg>
