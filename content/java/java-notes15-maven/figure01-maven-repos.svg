<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" role="img" aria-labelledby="t d">
  <title id="t">Maven 依赖查找的顺序与冲突解决</title>
  <desc id="d">Maven 按本地仓库、中央仓库、声明的远程仓库顺序查找依赖。版本冲突按直接依赖优先、最近者优先两条规则解决，可用 dependencyManagement 统一管理版本</desc>
  <defs>
    <style>
      .hd   { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:15px; font-weight:600; fill:#1f1f1f; }
      .lbl  { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:13px; fill:#1f1f1f; }
      .code { font-family:Consolas,'Cascadia Mono',Menlo,monospace; font-size:12px; fill:#1f1f1f; }
      .note { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:11px; fill:#5a6572; }
      .box  { fill:#f5f7fa; stroke:#c9d2dd; stroke-width:1.4; }
      .hit  { fill:#eefaf0; stroke:#5cb87a; stroke-width:1.5; }
      .miss { fill:#fdeeee; stroke:#d98b8b; stroke-width:1.4; }
      .mgmt { fill:#eef4ff; stroke:#7aa5e8; stroke-width:1.5; }
      .warn { fill:#fff6e8; stroke:#e0a458; stroke-width:1.4; }
      .line { stroke:#7a8899; stroke-width:1.4; fill:none; }
    </style>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a8899"/>
    </marker>
  </defs>
  <rect width="820" height="400" fill="#ffffff"/>
  <text class="hd" x="16" y="24">查找顺序</text>

  <rect class="box" x="16" y="36" width="150" height="40" rx="6"/>
  <text class="code" x="30" y="52">pom 中声明依赖</text>
  <text class="note" x="30" y="68">groupId:artifactId</text>

  <line x1="170" y1="56" x2="204" y2="56" class="line" marker-end="url(#arw)"/>

  <rect class="hit" x="208" y="36" width="180" height="40" rx="6"/>
  <text class="code" x="222" y="52">1. 本地仓库</text>
  <text class="note" x="222" y="68">~/.m2/repository</text>
  <text class="note" x="396" y="52">命中则返回</text>
  <text class="note" x="396" y="68">这也是离线构建能工作的原因</text>

  <line x1="300" y1="80" x2="300" y2="96" class="line" marker-end="url(#arw)"/>

  <rect class="box" x="208" y="100" width="180" height="40" rx="6"/>
  <text class="code" x="222" y="116">2. 中央仓库</text>
  <text class="note" x="222" y="132">repo.maven.apache.org</text>
  <text class="note" x="396" y="116">未命中则下载</text>
  <text class="note" x="396" y="132">并缓存进本地仓库</text>

  <line x1="300" y1="144" x2="300" y2="160" class="line" marker-end="url(#arw)"/>

  <rect class="box" x="208" y="164" width="180" height="40" rx="6"/>
  <text class="code" x="222" y="180">3. 自定义仓库</text>
  <text class="note" x="222" y="196">&lt;repositories&gt; 声明</text>
  <text class="note" x="396" y="180">如公司 Nexus</text>
  <text class="note" x="396" y="196">可配 settings.xml 镜像加速</text>

  <rect class="miss" x="208" y="224" width="180" height="36" rx="6"/>
  <text class="code" x="222" y="247">都没有 → 报错</text>

  <line x1="16" y1="280" x2="804" y2="280" stroke="#e0e4e9" stroke-width="1"/>
  <text class="hd" x="16" y="302">版本冲突：依赖调解的两条规则</text>

  <rect class="mgmt" x="16" y="314" width="390" height="72" rx="7"/>
  <text class="note" x="30" y="334">规则一：直接依赖优先</text>
  <text class="note" x="30" y="352">本项目直接声明的版本，胜过传递进来的</text>
  <text class="note" x="30" y="374">例：直接写 guava:33.0，A 传递 31.0 → 最终 33.0</text>

  <rect class="mgmt" x="414" y="314" width="390" height="72" rx="7"/>
  <text class="note" x="428" y="334">规则二：最近者优先</text>
  <text class="note" x="428" y="352">依赖链上越靠近本项目的版本越优先</text>
  <text class="note" x="428" y="374">例：A→B→C(1.0)，A→D→C(2.0) → 取 1.0</text>
</svg>
