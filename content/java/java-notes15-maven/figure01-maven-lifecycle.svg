<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" role="img" aria-labelledby="t d">
  <title id="t">Maven 生命周期与常用插件</title>
  <desc id="d">jar 打包的默认生命周期为 validate 到 deploy。package 只产出 target 目录，install 装入本地仓库，deploy 上传到远程仓库</desc>
  <defs>
    <style>
      .hd   { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:15px; font-weight:600; fill:#1f1f1f; }
      .lbl  { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:13px; fill:#1f1f1f; }
      .code { font-family:Consolas,'Cascadia Mono',Menlo,monospace; font-size:12px; fill:#1f1f1f; }
      .note { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:11px; fill:#5a6572; }
      .p1   { fill:#eefaf0; stroke:#5cb87a; stroke-width:1.4; }
      .p2   { fill:#eef4ff; stroke:#7aa5e8; stroke-width:1.4; }
      .p3   { fill:#fff6e8; stroke:#e0a458; stroke-width:1.4; }
      .p4   { fill:#f0f3f7; stroke:#8b98a8; stroke-width:1.4; }
      .warn { fill:#fdeeee; stroke:#d98b8b; stroke-width:1.4; }
      .line { stroke:#7a8899; stroke-width:1.4; fill:none; }
    </style>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a8899"/>
    </marker>
  </defs>
  <rect width="820" height="400" fill="#ffffff"/>
  <text class="hd" x="16" y="24">jar 打包的默认生命周期（执行某阶段会依次执行其之前的所有阶段）</text>

  <rect class="p4" x="16" y="40" width="86" height="40" rx="6"/>
  <text class="code" x="30" y="58">validate</text>
  <text class="note" x="30" y="74">校验</text>

  <line x1="104" y1="60" x2="128" y2="60" class="line" marker-end="url(#arw)"/>

  <rect class="p1" x="132" y="40" width="86" height="40" rx="6"/>
  <text class="code" x="146" y="58">compile</text>
  <text class="note" x="146" y="74">编译</text>
  <text class="note" x="132" y="96">compiler-plugin</text>

  <line x1="220" y1="60" x2="244" y2="60" class="line" marker-end="url(#arw)"/>

  <rect class="p1" x="248" y="40" width="86" height="40" rx="6"/>
  <text class="code" x="262" y="58">test</text>
  <text class="note" x="262" y="74">单测</text>
  <text class="note" x="248" y="96">surefire-plugin</text>

  <line x1="336" y1="60" x2="360" y2="60" class="line" marker-end="url(#arw)"/>

  <rect class="p3" x="364" y="40" width="86" height="40" rx="6"/>
  <text class="code" x="378" y="58">package</text>
  <text class="note" x="378" y="74">打包</text>
  <text class="note" x="364" y="96">jar / war-plugin</text>

  <line x1="452" y1="60" x2="476" y2="60" class="line" marker-end="url(#arw)"/>

  <rect class="p4" x="480" y="40" width="86" height="40" rx="6"/>
  <text class="code" x="494" y="58">verify</text>
  <text class="note" x="494" y="74">校验产物</text>

  <line x1="568" y1="60" x2="592" y2="60" class="line" marker-end="url(#arw)"/>

  <rect class="p2" x="596" y="40" width="86" height="40" rx="6"/>
  <text class="code" x="610" y="58">install</text>
  <text class="note" x="610" y="74">装本地</text>
  <text class="note" x="596" y="96">install-plugin</text>

  <line x1="684" y1="60" x2="708" y2="60" class="line" marker-end="url(#arw)"/>

  <rect class="p2" x="712" y="40" width="92" height="40" rx="6"/>
  <text class="code" x="726" y="58">deploy</text>
  <text class="note" x="726" y="74">传远程</text>
  <text class="note" x="712" y="96">deploy-plugin</text>

  <line x1="16" y1="118" x2="804" y2="118" stroke="#e0e4e9" stroke-width="1"/>

  <text class="hd" x="16" y="140">三个最容易搞混的阶段</text>

  <rect class="p3" x="16" y="152" width="256" height="88" rx="7"/>
  <text class="code" x="30" y="172">mvn package</text>
  <text class="note" x="30" y="192">产物在 target/ 目录</text>
  <text class="note" x="30" y="212">不进入本地仓库</text>
  <text class="note" x="30" y="230">其他项目还用不了它</text>

  <rect class="p2" x="282" y="152" width="256" height="88" rx="7"/>
  <text class="code" x="296" y="172">mvn install</text>
  <text class="note" x="296" y="192">装进 ~/.m2/repository</text>
  <text class="note" x="296" y="212">同机器其他项目可直接依赖</text>
  <text class="note" x="296" y="230">多模块开发必备</text>

  <rect class="p2" x="548" y="152" width="256" height="88" rx="7"/>
  <text class="code" x="562" y="172">mvn deploy</text>
  <text class="note" x="562" y="192">上传到远程仓库</text>
  <text class="note" x="562" y="212">需要配置 settings.xml</text>
  <text class="note" x="562" y="230">对外发布版本</text>

  <rect class="warn" x="16" y="252" width="788" height="62" rx="7"/>
  <text class="note" x="30" y="274">跳过测试的两个参数含义不同，写错会漏掉测试代码里的编译错误：</text>
  <text class="code" x="30" y="296">-DskipTests</text>
  <text class="note" x="130" y="296">不运行测试，但测试代码仍会被编译</text>
  <text class="code" x="470" y="296">-Dmaven.test.skip=true</text>
  <text class="note" x="656" y="296">连编译也跳过</text>
  <text class="note" x="30" y="314">排查问题需要真跑时用 mvn clean install，默认不该跳过</text>

  <line x1="16" y1="330" x2="804" y2="330" stroke="#e0e4e9" stroke-width="1"/>
  <text class="note" x="16" y="352">父 POM 中统一插件版本请用 pluginManagement（只管配置）；用 plugins 会让所有子模块都执行该插件</text>
  <text class="note" x="16" y="374">统一依赖版本请用 dependencyManagement（只管版本）；排障首选用 mvn help:effective-pom 看最终合并结果</text>
</svg>
