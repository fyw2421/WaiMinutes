<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" role="img" aria-labelledby="t d">
  <title id="t">GoF 设计模式的三大分类</title>
  <desc id="d">二十三种模式分为创建型五种、行为型十一种、结构型七种，各自解决实例化、组合与交互三类问题</desc>
  <defs>
    <style>
      .hd   { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:15px; font-weight:600; fill:#1f1f1f; }
      .lbl  { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:13px; fill:#1f1f1f; }
      .code { font-family:Consolas,'Cascadia Mono',Menlo,monospace; font-size:12px; fill:#1f1f1f; }
      .note { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:11px; fill:#5a6572; }
      .cr   { fill:#eefaf0; stroke:#5cb87a; stroke-width:1.6; }
      .st   { fill:#eef4ff; stroke:#7aa5e8; stroke-width:1.6; }
      .be   { fill:#fff6e8; stroke:#e0a458; stroke-width:1.6; }
      .box  { fill:#ffffff; stroke:#c9d2dd; stroke-width:1.2; }
    </style>
  </defs>
  <rect width="820" height="420" fill="#ffffff"/>
  <text class="hd" x="16" y="24">GoF（1994）：23 种模式，三类问题</text>

  <!-- 创建型 -->
  <rect class="cr" x="16" y="38" width="252" height="240" rx="8"/>
  <text class="lbl" x="30" y="62" font-weight="600">创建型（5）· 解决「实例化」</text>
  <text class="note" x="30" y="80">把"用什么类、怎么创建"与"用什么"分离</text>

  <rect class="box" x="30" y="90" width="112" height="24" rx="4"/>
  <text class="note" x="40" y="107">单例 Singleton</text>
  <rect class="box" x="148" y="90" width="106" height="24" rx="4"/>
  <text class="note" x="158" y="107">工厂方法</text>
  <rect class="box" x="30" y="120" width="112" height="24" rx="4"/>
  <text class="note" x="40" y="137">抽象工厂</text>
  <rect class="box" x="148" y="120" width="106" height="24" rx="4"/>
  <text class="note" x="158" y="137">建造者 Builder</text>
  <rect class="box" x="30" y="150" width="224" height="24" rx="4"/>
  <text class="note" x="40" y="167">原型 Prototype</text>

  <text class="note" x="30" y="196">JDK 实例</text>
  <text class="code" x="30" y="214">List.of() / Arrays.asList()</text>
  <text class="code" x="30" y="232">CopyOnWriteArrayList</text>
  <text class="code" x="30" y="250">→ 内部靠 copy 构造新数组</text>
  <text class="code" x="30" y="268">Collections.singletonList()</text>

  <!-- 结构型 -->
  <rect class="st" x="284" y="38" width="252" height="240" rx="8"/>
  <text class="lbl" x="298" y="62" font-weight="600">结构型（7）· 解决「组合」</text>
  <text class="note" x="298" y="80">让类之间的协作更灵活</text>

  <rect class="box" x="298" y="90" width="106" height="24" rx="4"/>
  <text class="note" x="308" y="107">适配器 Adapter</text>
  <rect class="box" x="410" y="90" width="112" height="24" rx="4"/>
  <text class="note" x="420" y="107">装饰器 Decorator</text>
  <rect class="box" x="298" y="120" width="106" height="24" rx="4"/>
  <text class="note" x="308" y="137">组合 Composite</text>
  <rect class="box" x="410" y="120" width="112" height="24" rx="4"/>
  <text class="note" x="420" y="137">外观 Facade</text>
  <rect class="box" x="298" y="150" width="106" height="24" rx="4"/>
  <text class="note" x="308" y="167">桥接 Bridge</text>
  <rect class="box" x="410" y="150" width="112" height="24" rx="4"/>
  <text class="note" x="420" y="167">代理 Proxy</text>
  <rect class="box" x="298" y="180" width="224" height="24" rx="4"/>
  <text class="note" x="308" y="197">享元 Flyweight</text>

  <text class="note" x="298" y="226">JDK 实例</text>
  <text class="code" x="298" y="244">BufferedInputStream 装饰器</text>
  <text class="code" x="298" y="262">InputStreamReader 适配器</text>
  <text class="code" x="298" y="280">Collections.unmodifiable* 代理</text>

  <!-- 行为型 -->
  <rect class="be" x="552" y="38" width="252" height="240" rx="8"/>
  <text class="lbl" x="566" y="62" font-weight="600">行为型（11）· 解决「交互」</text>
  <text class="note" x="566" y="80">对象之间怎么协作、职责怎么分</text>

  <rect class="box" x="566" y="90" width="106" height="24" rx="4"/>
  <text class="note" x="576" y="107">策略 Strategy</text>
  <rect class="box" x="678" y="90" width="112" height="24" rx="4"/>
  <text class="note" x="688" y="107">模板方法</text>
  <rect class="box" x="566" y="120" width="106" height="24" rx="4"/>
  <text class="note" x="576" y="137">观察者 Observer</text>
  <rect class="box" x="678" y="120" width="112" height="24" rx="4"/>
  <text class="note" x="688" y="137">责任链</text>
  <rect class="box" x="566" y="150" width="106" height="24" rx="4"/>
  <text class="note" x="576" y="167">状态 State</text>
  <rect class="box" x="678" y="150" width="112" height="24" rx="4"/>
  <text class="note" x="688" y="167">命令 Command</text>
  <rect class="box" x="566" y="180" width="106" height="24" rx="4"/>
  <text class="note" x="576" y="197">迭代器</text>
  <rect class="box" x="678" y="180" width="112" height="24" rx="4"/>
  <text class="note" x="688" y="197">访问者 Visitor</text>
  <rect class="box" x="566" y="210" width="106" height="24" rx="4"/>
  <text class="note" x="576" y="227">中介者</text>
  <rect class="box" x="678" y="210" width="112" height="24" rx="4"/>
  <text class="note" x="688" y="227">备忘录</text>

  <text class="note" x="566" y="256">JDK 实例</text>
  <text class="code" x="566" y="274">AbstractList 模板方法</text>

  <line x1="16" y1="292" x2="804" y2="292" stroke="#e0e4e9" stroke-width="1"/>
  <text class="hd" x="16" y="314">用错和用对的界线</text>

  <rect class="box" x="16" y="324" width="386" height="84" rx="6"/>
  <text class="note" x="30" y="344">过度设计的信号</text>
  <text class="note" x="30" y="362">• 为只有一个实现、且不会变的接口建工厂 + 单例 + 策略三层</text>
  <text class="note" x="30" y="378">• 一个 20 行的类拆成 8 个类，只为「符合模式」</text>
  <text class="note" x="30" y="396">• 读代码要先理解框架，才看得懂业务在干什么</text>

  <rect class="box" x="418" y="324" width="386" height="84" rx="6"/>
  <text class="note" x="432" y="344">值得上的信号</text>
  <text class="note" x="432" y="362">• 同一段逻辑在 3 处以上重复</text>
  <text class="note" x="432" y="378">• 改一个需求要同时改 5 个文件</text>
  <text class="note" x="432" y="396">• 依赖具体实现类、无法替换（测试时尤其明显）</text>
</svg>
