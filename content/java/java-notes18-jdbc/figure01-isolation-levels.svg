<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" role="img" aria-labelledby="t d">
  <title id="t">四种事务隔离级别与并发问题</title>
  <desc id="d">隔离级别从读未提交到串行化依次消除脏读、不可重复读和幻读。MySQL InnoDB 默认可重复读并用间隙锁进一步避免幻读，Oracle 和 PostgreSQL 默认读已提交</desc>
  <defs>
    <style>
      .hd   { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:15px; font-weight:600; fill:#1f1f1f; }
      .lbl  { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:13px; fill:#1f1f1f; }
      .code { font-family:Consolas,'Cascadia Mono',Menlo,monospace; font-size:12px; fill:#1f1f1f; }
      .note { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:11px; fill:#5a6572; }
      .hd2  { fill:#eef2f6; stroke:#8b98a8; stroke-width:1.4; }
      .r1   { fill:#fdeeee; stroke:#d98b8b; stroke-width:1.2; }
      .r2   { fill:#fff6e8; stroke:#e0a458; stroke-width:1.2; }
      .ok   { fill:#eefaf0; stroke:#5cb87a; stroke-width:1.2; }
      .mark { fill:#eef4ff; stroke:#7aa5e8; stroke-width:1.8; }
      .warn { fill:#f0f3f7; stroke:#8b98a8; stroke-width:1.4; }
    </style>
  </defs>
  <rect width="820" height="400" fill="#ffffff"/>
  <text class="hd" x="16" y="24">隔离级别越高越安全，并发性能越差</text>

  <!-- 表头 -->
  <rect class="hd2" x="16" y="38" width="300" height="32" rx="5"/>
  <text class="lbl" x="30" y="59" font-weight="600">隔离级别</text>
  <rect class="hd2" x="320" y="38" width="130" height="32" rx="5"/>
  <text class="lbl" x="385" y="59" text-anchor="middle" font-weight="600">脏读</text>
  <rect class="hd2" x="454" y="38" width="150" height="32" rx="5"/>
  <text class="lbl" x="529" y="59" text-anchor="middle" font-weight="600">不可重复读</text>
  <rect class="hd2" x="608" y="38" width="100" height="32" rx="5"/>
  <text class="lbl" x="658" y="59" text-anchor="middle" font-weight="600">幻读</text>
  <rect class="hd2" x="712" y="38" width="92" height="32" rx="5"/>
  <text class="lbl" x="758" y="59" text-anchor="middle" font-weight="600">并发性</text>

  <!-- 行 1 -->
  <rect class="r1" x="16" y="74" width="300" height="32" rx="5"/>
  <text class="code" x="30" y="95">READ UNCOMMITTED</text>
  <text class="note" x="385" y="95" text-anchor="middle">可能</text>
  <text class="note" x="529" y="95" text-anchor="middle">可能</text>
  <text class="note" x="658" y="95" text-anchor="middle">可能</text>
  <rect class="ok" x="712" y="74" width="92" height="32" rx="5"/>
  <text class="note" x="758" y="95" text-anchor="middle">最高</text>

  <!-- 行 2 -->
  <rect class="r2" x="16" y="110" width="300" height="32" rx="5"/>
  <text class="code" x="30" y="131">READ COMMITTED</text>
  <text class="note" x="385" y="131" text-anchor="middle" fill="#5cb87a">不会</text>
  <text class="note" x="529" y="131" text-anchor="middle">可能</text>
  <text class="note" x="658" y="131" text-anchor="middle">可能</text>
  <rect class="r2" x="712" y="110" width="92" height="32" rx="5"/>
  <text class="note" x="758" y="131" text-anchor="middle">较高</text>

  <!-- 行 3 MySQL 默认 -->
  <rect class="mark" x="16" y="146" width="300" height="32" rx="5"/>
  <text class="code" x="30" y="167">REPEATABLE READ</text>
  <text class="note" x="240" y="167" fill="#4a6fa5">MySQL 默认</text>
  <text class="note" x="385" y="167" text-anchor="middle" fill="#5cb87a">不会</text>
  <text class="note" x="529" y="167" text-anchor="middle" fill="#5cb87a">不会</text>
  <text class="note" x="658" y="167" text-anchor="middle">可能</text>
  <rect class="r1" x="712" y="146" width="92" height="32" rx="5"/>
  <text class="note" x="758" y="167" text-anchor="middle">较低</text>

  <!-- 行 4 -->
  <rect class="r2" x="16" y="182" width="300" height="32" rx="5"/>
  <text class="code" x="30" y="203">SERIALIZABLE</text>
  <text class="note" x="385" y="203" text-anchor="middle" fill="#5cb87a">不会</text>
  <text class="note" x="529" y="203" text-anchor="middle" fill="#5cb87a">不会</text>
  <text class="note" x="658" y="203" text-anchor="middle" fill="#5cb87a">不会</text>
  <rect class="r1" x="712" y="182" width="92" height="32" rx="5"/>
  <text class="note" x="758" y="203" text-anchor="middle">最低</text>

  <!-- 三个问题 -->
  <text class="hd" x="16" y="246">三个并发问题分别指什么</text>

  <rect class="r1" x="16" y="258" width="252" height="52" rx="6"/>
  <text class="lbl" x="30" y="278" font-weight="600">脏读</text>
  <text class="note" x="30" y="298">读到了别人还没提交的修改，</text>
  <text class="note" x="30" y="312">对方一回滚就读到了不存在的数据</text>

  <rect class="r2" x="284" y="258" width="252" height="52" rx="6"/>
  <text class="lbl" x="298" y="278" font-weight="600">不可重复读</text>
  <text class="note" x="298" y="298">同一事务内两次读同一行，</text>
  <text class="note" x="298" y="312">结果不同（别人改了并提交）</text>

  <rect class="warn" x="552" y="258" width="252" height="52" rx="6"/>
  <text class="lbl" x="566" y="278" font-weight="600">幻读</text>
  <text class="note" x="566" y="298">两次同条件 SELECT 的行数不同</text>
  <text class="note" x="566" y="312">（别人插入或删除了行）</text>

  <rect class="warn" x="16" y="322" width="788" height="66" rx="7"/>
  <text class="note" x="30" y="344">MySQL InnoDB 默认 REPEATABLE READ，并用「间隙锁」在很大程度上避免了幻读 —— 比标准要求的更强</text>
  <text class="note" x="30" y="364">Oracle、PostgreSQL 默认 READ COMMITTED；大部分互联网业务也常用 READ COMMITTED 以换取更高并发</text>
  <text class="code" x="30" y="382">conn.setTransactionIsolation(Connection.TRANSACTION_READ_COMMITTED);</text>
</svg>
