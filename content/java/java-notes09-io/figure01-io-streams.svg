<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" role="img" aria-labelledby="t d">
  <title id="t">字节流与字符流的对应关系</title>
  <desc id="d">字节流处理二进制数据，字符流在字节流之上做字符编解码。读取文本必须用字符流，否则中文字节序列变成乱码</desc>
  <defs>
    <style>
      .hd   { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:15px; font-weight:600; fill:#1f1f1f; }
      .lbl  { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:13px; fill:#1f1f1f; }
      .code { font-family:Consolas,'Cascadia Mono',Menlo,monospace; font-size:12px; fill:#1f1f1f; }
      .note { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:12px; fill:#5a6572; }
      .byte { fill:#eef4ff; stroke:#7aa5e8; stroke-width:1.4; }
      .char { fill:#eefaf0; stroke:#5cb87a; stroke-width:1.4; }
      .dec  { fill:#fff6e8; stroke:#e0a458; stroke-width:1.4; }
      .bad  { fill:#fdeeee; stroke:#d98b8b; stroke-width:1.3; }
      .ok   { fill:#eefaf0; stroke:#5cb87a; stroke-width:1.3; }
      .line { stroke:#9aa7b5; stroke-width:1.3; fill:none; }
    </style>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a8899"/>
    </marker>
  </defs>
  <rect width="820" height="330" fill="#ffffff"/>
  <text class="hd" x="16" y="24">字节流 vs 字符流</text>

  <!-- 上排 字节流 -->
  <text class="lbl" x="16" y="52" font-weight="600">字节流（处理二进制）</text>
  <rect class="byte" x="150" y="36" width="130" height="26" rx="5"/>
  <text class="code" x="162" y="54">InputStream</text>
  <line x1="282" y1="49" x2="322" y2="49" stroke="#7a8899" stroke-width="1.3" marker-end="url(#arw)"/>
  <rect class="byte" x="324" y="36" width="170" height="26" rx="5"/>
  <text class="code" x="336" y="54">FileInputStream</text>
  <line x1="496" y1="49" x2="536" y2="49" stroke="#7a8899" stroke-width="1.3" marker-end="url(#arw)"/>
  <rect class="byte" x="538" y="36" width="170" height="26" rx="5"/>
  <text class="code" x="550" y="54">BufferedInputStream</text>

  <text class="note" x="16" y="82">适合：图片、音视频、压缩包等二进制内容。单位是字节，不做任何编码转换</text>

  <!-- 中间 装饰器加一层编解码 -->
  <line x1="415" y1="110" x2="415" y2="150" stroke="#9aa7b5" stroke-width="1.3"/>
  <rect class="dec" x="300" y="150" width="230" height="28" rx="5"/>
  <text class="code" x="312" y="169">InputStreamReader(UTF_8)</text>
  <text class="note" x="300" y="196">↑ 关键：字符编解码发生在这一层</text>

  <!-- 下排 字符流 -->
  <text class="lbl" x="16" y="222" font-weight="600">字符流（处理文本）</text>
  <rect class="char" x="150" y="206" width="130" height="26" rx="5"/>
  <text class="code" x="162" y="224">Reader</text>
  <line x1="282" y1="219" x2="322" y2="219" stroke="#7a8899" stroke-width="1.3" marker-end="url(#arw)"/>
  <rect class="char" x="324" y="206" width="170" height="26" rx="5"/>
  <text class="code" x="336" y="224">FileReader</text>
  <line x1="496" y1="219" x2="536" y2="219" stroke="#7a8899" stroke-width="1.3" marker-end="url(#arw)"/>
  <rect class="char" x="538" y="206" width="180" height="26" rx="5"/>
  <text class="code" x="550" y="224">BufferedReader</text>

  <text class="note" x="16" y="252">适合：txt / xml / json 等文本。单位是字符，读取时按指定编码还原</text>

  <line x1="16" y1="270" x2="804" y2="270" stroke="#e0e4e9" stroke-width="1"/>

  <rect class="bad" x="16" y="280" width="392" height="34" rx="5"/>
  <text class="code" x="28" y="301">new InputStreamReader(new FileInputStream(f),</text>
  <text class="code" x="120" y="301">StandardCharsets.UTF_8)</text>
  <text class="note" x="300" y="301">← 正确</text>

  <rect class="bad" x="420" y="280" width="384" height="34" rx="5"/>
  <text class="code" x="432" y="301">new FileInputStream(f)</text>
  <text class="note" x="596" y="301">← 中文乱码</text>
</svg>
